name: Build and Publish Docker Image

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Runs on every trigger. Branch pushes run only this job and push nothing.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Same base image as the Dockerfile: the image itself leaves app/tests out
    # (.dockerignore), so the suite runs on its base with the same packages.
    container:
      image: python:3.11-slim
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install redis-server
        run: |
          apt-get update
          apt-get install -y --no-install-recommends redis-server

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # The app reads its static files from /app/app/static (app/main.py,
      # app/pages.py), so lay the checkout out where the image puts it.
      - name: Lay out the app at /app
        run: |
          mkdir -p /app
          cp -a "$GITHUB_WORKSPACE"/. /app/
          mkdir -p /app/data/ticket_uploads /app/app/static/uploads

      # Production runs an embedded Redis via supervisord; the suite uses its
      # database 15 (app/tests/__init__.py).
      - name: Start Redis
        run: |
          redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --daemonize yes
          for i in $(seq 1 20); do redis-cli ping && break; sleep 0.5; done
          redis-cli ping

      # Tests skip themselves when the app cannot import or Redis is missing,
      # so a skip here means a broken environment, not a pass.
      # Actions masks only the whole secret, so each string is masked on its own
      # first: any assertion, traceback or log line that echoes one prints ***
      # instead. The list comes from the guard's own parser, so what is masked
      # is exactly what is checked (commas and newlines both separate).
      - name: Run the test suite
        working-directory: /app
        env:
          WEBSERVARR_FORBIDDEN_STRINGS: ${{ secrets.WEBSERVARR_FORBIDDEN_STRINGS }}
        run: |
          python -c 'from app.tests.test_shell_contract import FORBIDDEN_STRINGS as f; [print(f"::add-mask::{s}") for s in f]'
          python -m unittest discover -s /app/app/tests -t /app 2>&1 | tee /tmp/unittest.log
          if grep -q "skipped=" /tmp/unittest.log; then
            echo "::error::Tests were skipped; the CI environment is missing something the suite needs."
            exit 1
          fi

  # Front-end checks that need JavaScript, which the Python image has none of:
  # the Integrations tab's sameAddress() against the server's shared cases,
  # the Appearance tab's contrast maths against the Python reference, the
  # soft-navigation router's link and response rules (router_vectors.json)
  # and its navigations run in a DOM (router_runtime.mjs).
  js-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dev-only packages from the lock file: the router's runtime cases run
      # in happy-dom. Nothing here reaches the image (.dockerignore).
      - name: Install the dev packages
        run: npm ci --no-audit --no-fund

      - name: Run the JavaScript checks
        run: |
          node app/tests/js/same_address.mjs
          node app/tests/js/contrast.mjs
          node app/tests/js/router.mjs
          node app/tests/js/router_runtime.mjs
          node app/tests/js/debug_leaks.mjs
          node app/tests/js/view_transition.mjs
          node app/tests/js/service_status.mjs
          node app/tests/js/reader_progress.mjs
          node app/tests/js/player_engine.mjs
          node app/tests/js/player_saves.mjs
          node app/tests/js/player_ui.mjs
          node app/tests/js/player_features.mjs
          node app/tests/js/player_findplace.mjs
          node app/tests/js/books_page.mjs
          node app/tests/js/book_page.mjs
          node app/tests/js/books_stats.mjs
          node app/tests/js/home_continue.mjs
          node app/tests/js/settings_books.mjs
          node app/tests/js/phone_nav.mjs
          node app/tests/js/install.mjs

  build-and-push:
    needs: [test, js-checks]
    # Unchanged triggers: only v* tags and manual dispatch build an image.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
