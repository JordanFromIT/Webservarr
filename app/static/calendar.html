<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Calendar</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->
<!-- Main Content Area -->
<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- ws:header -->
<!-- Scrollable Content: the page (spec 4.1), swapped by the router -->
<div id="wsPage" data-ws-module="/static/js/pages/calendar.js?v=1" class="flex-1 flex flex-col min-h-0 lg:overflow-hidden relative">
<h1 class="sr-only">Calendar</h1>

<!-- Calendar area — fills full viewport height -->
<div class="flex flex-col flex-1 min-h-0 p-4 lg:p-8">

<!-- Calendar Header: nav + month label -->
<div class="glass-card rounded-xl p-4 mb-4 shrink-0">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<button id="prevMonthBtn" class="p-2 rounded-lg hover:bg-frosted-blue/10 transition-colors text-steel-blue hover:text-frosted-blue" title="Previous month" data-action="prev-month">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<button id="nextMonthBtn" class="p-2 rounded-lg hover:bg-frosted-blue/10 transition-colors text-steel-blue hover:text-frosted-blue" title="Next month" data-action="next-month">
<span class="material-symbols-outlined">chevron_right</span>
</button>
<h2 id="monthLabel" class="text-lg lg:text-xl font-bold text-frosted-blue ml-2"></h2>
</div>
<button id="todayBtn" data-action="today" class="px-3 py-1.5 rounded-lg bg-primary/20 border border-primary/30 text-frosted-blue text-xs font-bold uppercase tracking-wider hover:bg-primary/30 transition-colors">
Today
</button>
</div>
</div>

<!-- Day-of-week headers -->
<div id="dayHeaders" class="hidden lg:grid grid-cols-7 gap-px shrink-0">
<div class="text-center text-[10px] lg:text-xs font-bold uppercase tracking-wider text-steel-blue py-2">Sun</div>
<div class="text-center text-[10px] lg:text-xs font-bold uppercase tracking-wider text-steel-blue py-2">Mon</div>
<div class="text-center text-[10px] lg:text-xs font-bold uppercase tracking-wider text-steel-blue py-2">Tue</div>
<div class="text-center text-[10px] lg:text-xs font-bold uppercase tracking-wider text-steel-blue py-2">Wed</div>
<div class="text-center text-[10px] lg:text-xs font-bold uppercase tracking-wider text-steel-blue py-2">Thu</div>
<div class="text-center text-[10px] lg:text-xs font-bold uppercase tracking-wider text-steel-blue py-2">Fri</div>
<div class="text-center text-[10px] lg:text-xs font-bold uppercase tracking-wider text-steel-blue py-2">Sat</div>
</div>

<!-- Calendar grid — fills remaining height -->
<div id="calendarGrid" class="grid grid-cols-7 gap-px flex-1 min-h-0 lg:overflow-hidden" data-arrive="month" style="grid-template-rows: repeat(5, 1fr)">
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
<div class="skel rounded-lg" aria-hidden="true"></div>
</div>

</div>

<!-- Day Detail Panel — overlays bottom of viewport, doesn't affect grid size -->
<div id="dayDetailPanel" class="hidden absolute bottom-0 left-0 right-0 mx-4 lg:mx-8 mb-4 lg:mb-8 glass-card rounded-xl p-4 lg:p-5 max-h-[40vh] overflow-y-auto custom-scrollbar z-20 shadow-2xl border border-steel-blue/20">
<button id="closePanelBtn" class="absolute top-3 right-3 text-steel-blue hover:text-frosted-blue transition-colors z-10" data-action="close-panel">
<span class="material-symbols-outlined">close</span>
</button>
<h3 id="detailDateLabel" class="text-lg font-bold text-frosted-blue mb-4"></h3>
<div id="detailReleasesList" class="space-y-3"></div>
</div>

</div>

</main>

<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
</body>
</html>
