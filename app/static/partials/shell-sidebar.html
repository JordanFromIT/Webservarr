<!--
  Page shell: desktop sidebar, mobile top bar, mobile drawer, scroll hint.

  Rendered on the server for the signed-in user and the operator's branding
  (app/pages.py fills the placeholders), so it is in the document before
  any script runs and is identical on every page. shell.js only wires the
  drawer, menus and logout. Nothing here is constructed by JavaScript.
-->
<aside id="desktopSidebar" class="hidden lg:flex w-64 bg-baltic-blue/20 border-r border-steel-blue/30 flex-col h-screen shrink-0">
  <div class="p-6 flex flex-col items-center">
    {{{logo_html}}}
    <h1 class="text-frosted-blue font-bold text-lg leading-none text-center {{app_name_cls}}">{{app_name}}</h1>
  </div>
  <nav id="desktopNav" class="flex-1 min-h-0 overflow-y-auto px-4 py-4 space-y-1" aria-label="Main">
{{{nav_links}}}
  </nav>
  <div class="p-4 border-t border-steel-blue/20">
    <p id="appVersion" class="text-steel-blue text-[10px] text-center {{admin_block}}">{{version}}</p>
  </div>
</aside>

<div id="mobileTopBar" class="lg:hidden sticky top-0 z-40 h-14 bg-black/80 backdrop-blur-md border-b border-steel-blue/20 flex items-center justify-between px-4">
  <button id="hamburgerBtn" class="p-2 text-steel-blue hover:text-bright transition-colors" aria-label="Open menu">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <span class="text-frosted-blue font-bold text-sm truncate max-w-[40%] {{app_name_cls}}">{{app_name}}</span>
  {{{bar_logo_html}}}
  <div class="relative flex items-center gap-1 sm:gap-2 min-w-0">
    <button class="relative p-1.5 sm:p-2 text-steel-blue hover:text-frosted-blue transition-colors shrink-0" title="Notifications" aria-label="Notifications">
      <span class="material-symbols-outlined">notifications</span>
    </button>
    <button id="mobileUserMenuBtn" class="flex items-center gap-1.5 sm:gap-2 cursor-pointer hover:opacity-80 transition-opacity min-w-0" aria-label="Account menu">
      <div class="text-right min-w-0">
        <p id="mobileUsername" class="text-xs font-bold text-frosted-blue leading-none truncate max-w-[80px] sm:max-w-[120px]">{{user_name}}</p>
        <p id="mobileRole" class="text-[10px] text-steel-blue hidden sm:block">{{user_role}}</p>
      </div>
    </button>
    <div id="mobileUserMenuDropdown" class="hidden absolute right-0 top-full mt-2 w-48 bg-black/95 border border-steel-blue/30 rounded-xl shadow-xl py-2 z-50">
      <a href="/settings#sign-in" class="flex items-center gap-3 px-4 py-2.5 text-sm text-frosted-blue hover:bg-primary/20 transition-colors {{admin_block}}">
        <span class="material-symbols-outlined text-steel-blue text-sm">manage_accounts</span>
        Account settings
      </a>
      <button data-logout class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-frosted-blue hover:bg-primary/20 transition-colors text-left">
        <span class="material-symbols-outlined text-steel-blue text-sm">logout</span>
        Sign Out
      </button>
    </div>
  </div>
</div>

<div id="drawerOverlay" class="lg:hidden fixed inset-0 z-50 bg-black/60 hidden" style="backdrop-filter:blur(2px)">
  <aside id="drawerPanel" class="w-72 bg-background-dark border-r border-steel-blue/30 h-full flex flex-col transform -translate-x-full transition-transform duration-300">
    <div class="p-6">
      <div class="flex items-center justify-between mb-3">
        <div class="flex-1"></div>
        <button id="drawerCloseBtn" class="p-1 text-steel-blue hover:text-bright transition-colors" aria-label="Close menu">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="flex flex-col items-center">
        {{{logo_html}}}
        <h1 class="text-frosted-blue font-bold text-lg leading-none text-center {{app_name_cls}}">{{app_name}}</h1>
      </div>
    </div>
    <nav id="drawerNav" class="flex-1 min-h-0 overflow-y-auto px-4 py-4 space-y-1" aria-label="Main">
{{{nav_links}}}
    </nav>
    <div class="p-4 border-t border-steel-blue/20">
      <button data-logout class="w-full flex items-center justify-center gap-2 py-2 text-sm font-medium text-steel-blue hover:text-bright transition-colors">
        <span class="material-symbols-outlined text-sm">logout</span> Sign Out
      </button>
      <p class="appVersionMobile text-steel-blue text-[10px] text-center mt-2 {{admin_block}}">{{version}}</p>
    </div>
  </aside>
</div>

<!-- Scroll-down hint (mobile only). shell.js shows it only while there is
     content below the fold and hides it at the bottom. -->
<div id="scrollDownHint" class="fixed bottom-6 left-1/2 -translate-x-1/2 pointer-events-none lg:hidden transition-opacity duration-300 opacity-0" aria-hidden="true">
  <span class="material-symbols-outlined text-steel-blue text-4xl animate-bounce motion-reduce:animate-none">arrow_downward</span>
</div>

<!-- The next page is fetched, and where the browser allows it rendered, while
     the pointer is still over the link. Only nav links qualify: never
     /auth/logout (a GET with side effects), the reader, or API URLs. -->
<script type="speculationrules">
{
  "prerender": [{"where": {"selector_matches": "#desktopNav a, #drawerNav a"}, "eagerness": "moderate"}],
  "prefetch":  [{"where": {"selector_matches": "#desktopNav a, #drawerNav a"}, "eagerness": "moderate"}]
}
</script>
