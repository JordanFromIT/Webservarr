<!--
  The server's gauges (Netdata): CPU, RAM and the network, rendered into both
  headers by app/pages.py (gauges_html): beside the status pill from lg, and
  between the top bar's title and the status chip below it. Only one header
  shows at any width. They show while Netdata is set up (html[data-netdata],
  theme.css) and stay hidden (data-pending holds their room) until the first
  reading, so they arrive whole and nothing beside them moves. One shell
  module (js/gauges.js) polls the readings for the whole app and writes every
  data-gauge-* in both copies; a soft navigation never swaps a header, so
  nothing is mounted twice.
  Below xl each gauge is a small ring with its reading under it ("CPU 12%";
  the network's arrows and unit name it, and its name is for screen readers),
  and in the top bar the copy takes the room up to the chip, so all three fit
  beside a short title at 320px (below 375px each reading takes two short
  lines: theme.css, .ws-gauge-*). From xl the ring is larger with its name
  over the reading. The percentages hold four characters and the network line
  a minimum width, so a changing reading never pushes the gauge after it.
-->
<div data-ws-gauges data-pending class="flex flex-1 items-center gap-1.5 h-0 -ml-1 -mr-3 lg:flex-none lg:mx-0 xl:gap-5">
<div class="flex flex-col items-center gap-1 xl:flex-row xl:gap-2.5">
<svg class="size-6 shrink-0 xl:size-9" viewBox="0 0 100 100" aria-hidden="true">
<circle class="text-steel-blue/20 stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="10"></circle>
<circle data-gauge-ring="cpu" class="text-gauge-cpu stroke-current gauge-circle" cx="50" cy="50" fill="transparent" r="40" stroke-linecap="round" stroke-width="10" style="stroke-dashoffset: 251;"></circle>
</svg>
<div class="ws-gauge-reading flex items-baseline gap-0.5 leading-none xl:block">
<p class="text-[10px] font-medium text-steel-blue">CPU</p>
<p data-gauge-text="cpu" class="min-w-[4ch] text-[11px] leading-none font-bold text-frosted-blue tabular-nums xl:mt-0.5 xl:text-sm">--%</p>
</div>
</div>
<div class="flex flex-col items-center gap-1 xl:flex-row xl:gap-2.5">
<svg class="size-6 shrink-0 xl:size-9" viewBox="0 0 100 100" aria-hidden="true">
<circle class="text-steel-blue/20 stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="10"></circle>
<circle data-gauge-ring="ram" class="text-gauge-ram stroke-current gauge-circle" cx="50" cy="50" fill="transparent" r="40" stroke-linecap="round" stroke-width="10" style="stroke-dashoffset: 251;"></circle>
</svg>
<div class="ws-gauge-reading flex items-baseline gap-0.5 leading-none xl:block">
<p class="text-[10px] font-medium text-steel-blue">RAM</p>
<p data-gauge-text="ram" class="min-w-[4ch] text-[11px] leading-none font-bold text-frosted-blue tabular-nums xl:mt-0.5 xl:text-sm">--%</p>
</div>
</div>
<div class="flex flex-col items-center gap-1 xl:flex-row xl:gap-2.5">
<svg class="size-6 shrink-0 xl:size-9" viewBox="0 0 100 100" aria-hidden="true">
<circle class="text-steel-blue/20 stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="10"></circle>
<circle data-gauge-ring="net" class="text-gauge-net stroke-current gauge-circle" cx="50" cy="50" fill="transparent" r="40" stroke-linecap="round" stroke-width="10" style="stroke-dashoffset: 251;"></circle>
</svg>
<div class="leading-none">
<p class="sr-only text-[10px] font-medium text-steel-blue uppercase xl:not-sr-only">Network</p>
<p class="ws-gauge-net flex items-center min-w-[12ch] whitespace-nowrap text-[10px] leading-none text-frosted-blue xl:mt-0.5 xl:text-xs"><span class="material-symbols-outlined text-[10px] -mr-px xl:text-xs" aria-hidden="true">arrow_upward</span><span class="sr-only">Upload</span><span data-gauge-net="up" class="tabular-nums">0</span><span data-gauge-unit-long class="sr-only">megabits per second</span><span class="material-symbols-outlined text-[10px] -mr-px ml-0.5 xl:ml-1.5 xl:text-xs" aria-hidden="true">arrow_downward</span><span class="sr-only">Download</span><span data-gauge-net="down" class="tabular-nums">0</span><span data-gauge-unit-long class="sr-only">megabits per second</span><span data-gauge-unit class="ml-1 text-frosted-blue/70" aria-hidden="true">Mbps</span></p>
</div>
</div>
</div>
