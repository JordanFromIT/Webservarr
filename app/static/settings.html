<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Settings</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
<!-- Select the tab from the hash before anything in the body paints: theme.css
     shows that tab's panel (and skeleton) and styles its tab from this
     attribute. The kit keeps it in step afterwards. -->
<script>
  (function () {
    var tabs = ['general', 'pages', 'appearance', 'sign-in', 'integrations', 'notifications'];
    var t = (location.hash || '').slice(1);
    if (tabs.indexOf(t) < 0) t = 'general';
    document.documentElement.setAttribute('data-settings-tab', t);
  })();
</script>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->
<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- ws:header -->
<div id="settingsScroll" class="flex-1 lg:overflow-y-auto custom-scrollbar">
  <div class="max-w-[1200px] w-full mx-auto px-4 lg:px-8 pt-6 lg:pt-8 pb-40">
    <header class="mb-6">
      <h1 class="text-[24px] lg:text-[32px] font-bold tracking-tight text-frosted-blue leading-tight">Settings</h1>
      <p class="text-[15px] text-frosted-blue/70 mt-1">Set up your site, choose what people see, and connect your services.</p>
    </header>

    <div class="relative border-b border-frosted-blue/10 mb-8">
      <div id="settingsTabScroller" class="overflow-x-auto ws-hide-scrollbar">
        <nav id="settingsTabs" role="tablist" aria-label="Settings sections" class="flex w-max gap-1 whitespace-nowrap pr-12 lg:pr-0">
          <a role="tab" id="tab-general" href="#general" data-tab="general" aria-controls="panel-general" aria-selected="false" class="ws-tab">General</a>
          <a role="tab" id="tab-pages" href="#pages" data-tab="pages" aria-controls="panel-pages" aria-selected="false" class="ws-tab">Pages</a>
          <a role="tab" id="tab-appearance" href="#appearance" data-tab="appearance" aria-controls="panel-appearance" aria-selected="false" class="ws-tab">Appearance</a>
          <a role="tab" id="tab-sign-in" href="#sign-in" data-tab="sign-in" aria-controls="panel-sign-in" aria-selected="false" class="ws-tab">Sign-in</a>
          <a role="tab" id="tab-integrations" href="#integrations" data-tab="integrations" aria-controls="panel-integrations" aria-selected="false" class="ws-tab">Integrations</a>
          <a role="tab" id="tab-notifications" href="#notifications" data-tab="notifications" aria-controls="panel-notifications" aria-selected="false" class="ws-tab">Notifications</a>
        </nav>
      </div>
      <div id="settingsTabHintLeft" class="ws-tab-hint-left absolute inset-y-0 left-0 w-12 flex items-center justify-start pointer-events-none lg:hidden transition-opacity duration-200" style="opacity:0" aria-hidden="true">
        <span class="material-symbols-outlined text-frosted-blue/70 text-base">arrow_back</span>
      </div>
      <div id="settingsTabHintRight" class="ws-tab-hint-right absolute inset-y-0 right-0 w-12 flex items-center justify-end pointer-events-none lg:hidden transition-opacity duration-200" style="opacity:0" aria-hidden="true">
        <span class="material-symbols-outlined text-frosted-blue/70 text-base">arrow_forward</span>
      </div>
    </div>
    <!-- The tab chosen in <head>, for assistive tech (its look comes from CSS).
         On a phone the strip also starts scrolled to it, with its edge hints,
         so it never paints at the start and then jumps. Both hints start
         hidden and show only when the strip overflows. The kit keeps all of
         it in step afterwards. -->
    <script>
      (function () {
        var a = document.getElementById('tab-' + document.documentElement.getAttribute('data-settings-tab'));
        if (a) a.setAttribute('aria-selected', 'true');
        var sc = document.getElementById('settingsTabScroller');
        if (!a || !sc || sc.scrollWidth <= sc.clientWidth) return;
        var r = a.getBoundingClientRect(), s = sc.getBoundingClientRect();
        if (r.right > s.right - 48) sc.scrollLeft += r.right - s.right + 48;
        var max = sc.scrollWidth - sc.clientWidth;
        document.getElementById('settingsTabHintLeft').style.opacity = sc.scrollLeft > 4 ? '1' : '0';
        document.getElementById('settingsTabHintRight').style.opacity = sc.scrollLeft >= max - 4 ? '0' : '1';
      })();
    </script>

    <section id="panel-general" data-settings-panel="general" role="tabpanel" aria-labelledby="tab-general">
      <!-- The tab's own shape, measured at 390, 640, 768 and 1440 (phone
           first): Your site's two fields (their help wraps to two lines on a
           phone), the Logo row (stacked on a phone, side by side from sm)
           and Backup's buttons and note. -->
      <div aria-hidden="true">
        <div class="mb-12">
          <div class="h-[56.5px] mb-5 pt-1"><div class="skel h-5 w-28 mb-3"></div><div class="skel h-4 w-80 max-w-full"></div></div>
          <div class="space-y-6 max-w-2xl"><div class="skel h-[116.1px] sm:h-[96.6px]"></div><div class="skel h-[116.1px] sm:h-[96.6px]"></div></div>
        </div>
        <div class="mb-12">
          <div class="h-[79px] sm:h-[56.5px] mb-5 pt-1"><div class="skel h-5 w-20 mb-3"></div><div class="skel h-4 w-96 max-w-full"></div></div>
          <div class="h-[352.6px] sm:h-[236.6px] md:h-[192.6px]">
            <div class="flex flex-col sm:flex-row gap-5"><div class="skel w-full sm:w-48 h-24 shrink-0 rounded-2xl"></div><div class="flex-1 space-y-4"><div class="skel h-11 w-80 max-w-full"></div><div class="skel h-4 w-72 max-w-full"></div></div></div>
          </div>
        </div>
        <div>
          <div class="h-[79px] mb-5 pt-1"><div class="skel h-5 w-24 mb-3"></div><div class="skel h-4 w-[34rem] max-w-full"></div></div>
          <div class="space-y-6"><div class="skel h-11 w-80 max-w-full"></div><div class="h-[39px] sm:h-[19.5px] flex items-center"><div class="skel h-3 w-96 max-w-full"></div></div></div>
        </div>
      </div>
    </section>
    <section id="panel-pages" data-settings-panel="pages" role="tabpanel" aria-labelledby="tab-pages">
      <!-- The tab's own shape: the Pages heading and its description (three
           lines on a phone, two from sm), the column heads on a wide screen,
           then the eight page rows. -->
      <div aria-hidden="true">
        <div class="h-[124px] sm:h-[79px] mb-5 pt-1">
          <div class="skel h-5 w-24 mb-4"></div>
          <div class="skel h-4 w-[40rem] max-w-full mb-2"></div>
          <div class="skel h-4 w-80 max-w-full"></div>
        </div>
        <div class="h-1 lg:h-[51.5px]"></div>
        <div class="space-y-2">
          <div class="skel rounded-2xl h-[176.8px] lg:h-[71.2px]"></div><div class="skel rounded-2xl h-[176.8px] lg:h-[71.2px]"></div>
          <div class="skel rounded-2xl h-[176.8px] lg:h-[71.2px]"></div><div class="skel rounded-2xl h-[176.8px] lg:h-[71.2px]"></div>
          <div class="skel rounded-2xl h-[176.8px] lg:h-[71.2px]"></div><div class="skel rounded-2xl h-[176.8px] lg:h-[71.2px]"></div>
          <div class="skel rounded-2xl h-[176.8px] lg:h-[71.2px]"></div><div class="skel rounded-2xl h-[176.8px] lg:h-[71.2px]"></div>
        </div>
      </div>
    </section>
    <section id="panel-appearance" data-settings-panel="appearance" role="tabpanel" aria-labelledby="tab-appearance">
      <!-- The tab's own shape: the Colours heading and six fields, and on a
           wide screen the 320px preview card beside them. -->
      <div class="lg:grid lg:grid-cols-[minmax(0,1fr)_320px] lg:gap-10" aria-hidden="true">
        <div class="min-w-0">
          <div class="h-[79px] sm:h-[56.5px] mb-5 pt-1">
            <div class="skel h-5 w-32 mb-3"></div>
            <div class="skel h-4 w-96 max-w-full"></div>
          </div>
          <div class="grid sm:grid-cols-2 gap-5 max-w-2xl">
            <div class="skel h-[96.6px]"></div><div class="skel h-[96.6px]"></div>
            <div class="skel h-[96.6px]"></div><div class="skel h-[96.6px]"></div>
            <div class="skel h-[96.6px]"></div><div class="skel h-[96.6px]"></div>
          </div>
        </div>
        <div class="hidden lg:block"><div class="skel h-[349.6px] rounded-2xl"></div></div>
      </div>
    </section>
    <section id="panel-sign-in" data-settings-panel="sign-in" role="tabpanel" aria-labelledby="tab-sign-in">
      <!-- The tab's own shape: the three method cards and Admin access, at
           the heights measured at 390, 640, 768 and 1440 (phone first). The
           Authentik card holds its fields and the Username & password card
           its account part only in some setups; the script below picks the
           right one from the page's own data before the first paint, as the
           tab itself will. -->
      <div aria-hidden="true">
        <div class="mb-12">
          <div class="h-[79px] md:h-[56.5px] mb-5 pt-1"><div class="skel h-5 w-36 mb-3"></div><div class="skel h-4 w-[36rem] max-w-full"></div></div>
          <div class="space-y-6">
            <div class="skel rounded-2xl h-[126.6px]"></div>
            <div class="skel rounded-2xl h-[126.6px]" data-skel-when="ak-bare"></div>
            <div class="skel rounded-2xl h-[510.9px] sm:h-[334.3px]" data-skel-when="ak-fields" hidden></div>
            <div class="skel rounded-2xl h-[147.6px] sm:h-[126.6px]" data-skel-when="simple-bare"></div>
            <div class="skel rounded-2xl h-[214.6px] sm:h-[174.1px]" data-skel-when="simple-line" hidden></div>
            <div class="skel rounded-2xl h-[602.5px] sm:h-[407.3px]" data-skel-when="simple-full" hidden></div>
          </div>
        </div>
        <div>
          <div class="h-[56.5px] mb-5 pt-1"><div class="skel h-5 w-32 mb-3"></div><div class="skel h-4 w-48 max-w-full"></div></div>
          <div class="skel h-[116.1px] md:h-[96.6px] max-w-2xl"></div>
        </div>
      </div>
      <script>
        // The same rules as signin.js, read from the page's data: Authentik's
        // fields show when it is on and set up, and the account part shows
        // when username-and-password sign-in is on (the full form only to an
        // admin signed in that way). A setup the data can't tell apart (a
        // switch off with an address kept) reads as the plain card.
        (function () {
          var d = window.WS_DATA || {}, m = (d.branding || {}).auth_methods || {}, u = d.user || {};
          var show = {
            'ak-bare': !m.authentik, 'ak-fields': !!m.authentik,
            'simple-bare': !m.simple,
            'simple-line': !!m.simple && u.auth_method !== 'simple',
            'simple-full': !!m.simple && u.auth_method === 'simple'
          };
          Array.prototype.forEach.call(document.querySelectorAll('#panel-sign-in [data-skel-when]'), function (n) {
            n.hidden = !show[n.getAttribute('data-skel-when')];
          });
        })();
      </script>
    </section>
    <section id="panel-integrations" data-settings-panel="integrations" role="tabpanel" aria-labelledby="tab-integrations">
      <!-- The tab's own shape: the intro line, then all five groups, each a
           heading and its collapsed cards (taller on a phone, where the
           longer descriptions wrap). -->
      <div aria-hidden="true">
        <div class="h-[45px] sm:h-[22.5px] mb-8 pt-1"><div class="skel h-4 w-[36rem] max-w-full"></div></div>
        <div class="mb-12">
          <div class="h-[30px] mb-5 flex items-center"><div class="skel h-5 w-36"></div></div>
          <div class="skel rounded-2xl h-[122.1px] sm:h-[102.6px]"></div>
        </div>
        <div class="mb-12">
          <div class="h-[30px] mb-5 flex items-center"><div class="skel h-5 w-28"></div></div>
          <div class="skel rounded-2xl h-[122.1px] sm:h-[102.6px]"></div>
        </div>
        <div class="mb-12">
          <div class="h-[30px] mb-5 flex items-center"><div class="skel h-5 w-24"></div></div>
          <div class="space-y-3">
            <div class="skel rounded-2xl h-[102.6px]"></div>
            <div class="skel rounded-2xl h-[122.1px] sm:h-[102.6px]"></div>
            <div class="skel rounded-2xl h-[102.6px]"></div>
          </div>
        </div>
        <div class="mb-12">
          <div class="h-[30px] mb-5 flex items-center"><div class="skel h-5 w-28"></div></div>
          <div class="space-y-3">
            <div class="skel rounded-2xl h-[102.6px]"></div>
            <div class="skel rounded-2xl h-[102.6px]"></div>
          </div>
        </div>
        <div>
          <div class="h-[30px] mb-5 flex items-center"><div class="skel h-5 w-32"></div></div>
          <div class="space-y-3">
            <div class="skel rounded-2xl h-[102.6px]"></div>
            <div class="skel rounded-2xl h-[122.1px] sm:h-[102.6px]"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="panel-notifications" data-settings-panel="notifications" role="tabpanel" aria-labelledby="tab-notifications">
      <!-- The tab's own shape: its three cards, each a heading block and a
           body at the measured heights (phone first, then wider: each
           description is two lines on a phone and one from sm, the test-push
           help fits one line from sm, where the four check fields also go
           two to a row). -->
      <div aria-hidden="true">
        <div class="mb-12">
          <div class="h-[79px] sm:h-[56.5px] mb-5 pt-1"><div class="skel h-5 w-48 mb-3"></div><div class="skel h-4 w-[34rem] max-w-full"></div></div>
          <div class="h-[193px] sm:h-[173.5px]">
            <div class="space-y-2">
              <div class="h-6 flex items-center"><div class="skel h-4 w-60 max-w-full"></div></div>
              <div class="h-5 flex items-center"><div class="skel h-3 w-64 max-w-full"></div></div>
              <div class="h-5 flex items-center"><div class="skel h-3 w-72 max-w-full"></div></div>
            </div>
            <div class="skel h-11 w-52 mt-6"></div>
          </div>
        </div>
        <div class="mb-12">
          <div class="h-[79px] sm:h-[56.5px] mb-5 pt-1"><div class="skel h-5 w-56 mb-3"></div><div class="skel h-4 w-[36rem] max-w-full"></div></div>
          <div class="h-[288.6px] max-w-2xl">
            <div class="skel h-[70px]"></div>
            <div class="skel h-[126px] mt-6"></div>
            <div class="skel h-11 w-52 mt-6"></div>
          </div>
        </div>
        <div>
          <div class="h-[79px] sm:h-[56.5px] mb-5 pt-1"><div class="skel h-5 w-44 mb-3"></div><div class="skel h-4 w-[28rem] max-w-full"></div></div>
          <div class="grid sm:grid-cols-2 gap-5 max-w-2xl">
            <div class="skel h-[96.6px]"></div><div class="skel h-[96.6px]"></div>
            <div class="skel h-[96.6px]"></div><div class="skel h-[96.6px]"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
</main>

<div id="settingsSaveBar" hidden></div>

<!-- Tab modules, loaded the first time their tab opens. A <template> is
     inert, so nothing here runs; the server still stamps each src. -->
<template id="settingsModules">
  <script data-tab="general" src="/static/js/settings/general.js?v=1"></script>
  <script data-tab="pages" src="/static/js/settings/pages.js?v=1"></script>
  <script data-tab="appearance" src="/static/js/settings/appearance.js?v=1"></script>
  <script data-tab="sign-in" src="/static/js/settings/signin.js?v=1"></script>
  <script data-tab="integrations" src="/static/js/settings/integrations.js?v=1"></script>
  <script data-tab="notifications" src="/static/js/settings/notifications.js?v=1"></script>
</template>

<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
<script src="/static/js/ui.js?v=1"></script>
<script src="/static/js/settings/kit.js?v=1"></script>
<script src="/static/js/settings/signin-rule.js?v=1"></script>
<script>
  checkAuth({ requireAdmin: true }).then(function (user) {
    if (user && window.WSSettings) WSSettings.boot();
  });
</script>
</body>
</html>
