<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Login</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
<style>
    .cinematic-overlay {
      background: radial-gradient(circle, rgb(var(--color-background) / 0.4) 0%, rgb(var(--color-background) / 0.9) 100%);
    }
    /* Light glass over the rotating artwork: the site's frost tokens
       (theme.css), the glass slab's ring, fill (sheen, grain, tint) and
       shadow, with the blur and strengths from Settings > Appearance like
       every other frosted surface. The owner asked for the card to be clearly see-through, so
       no dark underlay (that was judged too solid), only the page's own
       overlay under it. */
    .login-glass-card {
      background: var(--ws-frost-ring-layer), var(--ws-frost-fill);
      -webkit-backdrop-filter: var(--ws-frost-blur) var(--ws-frost-boost);
      backdrop-filter: var(--ws-frost-blur) var(--ws-frost-boost);
      border: 1px solid var(--ws-frost-edge);
      box-shadow: var(--ws-frost-shadow);
    }
    /* Small text on the glass. The card is this translucent on purpose, so
       over bright or busy artwork it is the text that has to carry itself:
       labels and the divider caption use the full text colour, the field
       icons and placeholders sit only as far below it as they need to still
       read as hints, and all of it is outlined in the theme's background
       colour. Four layers: a 1px halo and a 1px drop that give every glyph a
       dark edge whatever sits behind it (a 4px blur lets real detail
       through), then a tight and a wide glow that quiet the art around the
       words. */
    .login-glass-card label,
    #ssoDivider span,
    #loginForm .material-symbols-outlined,
    #loginForm input::placeholder {
      text-shadow: 0 0 1px rgb(var(--color-background) / 0.9),
                   0 1px 2px rgb(var(--color-background) / 0.9),
                   0 0 5px rgb(var(--color-background) / 0.75),
                   0 0 12px rgb(var(--color-background) / 0.5);
    }
    /* No backdrop blur means the artwork shows through sharp, which is busy
       behind text. Fall back to a mostly opaque card instead. */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .login-glass-card {
        background:
          linear-gradient(var(--ws-frost-tint), var(--ws-frost-tint)),
          rgb(var(--color-background) / 0.8);
      }
    }
    .backdrop-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1.5s ease-in-out;
      will-change: opacity, transform;
    }
    /* Ken Burns, one move per picture. The script puts .is-moving on a slide
       just before it fades in (restartDrift below), so every picture starts
       at scale 1 and grows about 1% a second toward one of four corners:
       1.115 by the time its fade-out ends at 11.5s, 1.14 at the 14s end.
       Linear, and longer than the picture is on screen, so it never visibly
       slows while the rotation keeps time. A picture can overstay, though:
       the next one's preload can run late or fail, and then nothing restarts
       the move. So the move does not end on a hold. A second animation takes
       over at 14s, starting exactly where the move ends (login-drift-on's
       first frame is login-drift's last) and at nearly the same speed (its
       first leg leaves at about 0.84%/s and eases to a stop at 1.20 over
       16s), then eases back and loops, until the next successful rotation
       resets the slide. The outgoing slide is never touched, so it keeps
       moving through its fade. The pan is tied to the scale (both leave zero
       together) and stays well inside the (scale - 1) / 2 overhang in both
       animations, so no edge is ever uncovered. Transform only: the
       compositor owns it and the main thread stays idle. A single picture
       (no rotation) drifts back and forth from the start instead (.is-solo).
       The card's glass is untouched. */
    .backdrop-slide.is-moving {
      animation: login-drift 14s linear forwards,
                 login-drift-on 32s linear 14s infinite;
    }
    .backdrop-slide.is-solo { animation: login-drift-solo 20s ease-in-out infinite alternate; }
    .backdrop-slide.drift-nw { --drift-x: -2%; --drift-y: -2%; }
    .backdrop-slide.drift-ne { --drift-x: 2%; --drift-y: -2%; }
    .backdrop-slide.drift-sw { --drift-x: -2%; --drift-y: 2%; }
    .backdrop-slide.drift-se { --drift-x: 2%; --drift-y: 2%; }
    @keyframes login-drift {
      from { transform: scale(1) translate(0, 0); }
      to   { transform: scale(1.14) translate(var(--drift-x, 0%), var(--drift-y, 0%)); }
    }
    @keyframes login-drift-on {
      0%   { transform: scale(1.14) translate(var(--drift-x, 0%), var(--drift-y, 0%)); animation-timing-function: cubic-bezier(0.2, 0.45, 0.5, 1); }
      50%  { transform: scale(1.20) translate(calc(var(--drift-x, 0%) * 1.5), calc(var(--drift-y, 0%) * 1.5)); animation-timing-function: ease-in-out; }
      100% { transform: scale(1.14) translate(var(--drift-x, 0%), var(--drift-y, 0%)); }
    }
    @keyframes login-drift-solo {
      from { transform: scale(1) translate(0, 0); }
      to   { transform: scale(1.10) translate(-1%, 0.6%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .backdrop-slide.is-moving, .backdrop-slide.is-solo { animation: none; }
    }
    /* The card's place on a wide screen (Settings > Pages > Login page). The
       page renderer sets data-login-card="left" or "right" on the root; with no
       mark the card stays in the middle, as shipped. Only from 64rem:
       narrower than that a 440px card near one edge still covers the middle
       of the picture, so phones and tablets keep it centred. The status pill
       goes with the card, centred under it, so the middle of the picture is
       clear from top to bottom. Still vertically centred, and position only:
       the card's glass and colours are untouched. */
    @media (min-width: 64rem) {
      html[data-login-card] { --login-card-edge: clamp(3rem, 6vw, 8rem); }
      html[data-login-card] footer {
        display: grid;
        grid-template-columns: minmax(0, 440px);
        justify-items: center;
      }
      html[data-login-card="left"] main {
        align-items: flex-start;
        padding-inline-start: var(--login-card-edge);
      }
      html[data-login-card="left"] footer {
        justify-content: start;
        padding-inline-start: var(--login-card-edge);
      }
      html[data-login-card="right"] main {
        align-items: flex-end;
        padding-inline-end: var(--login-card-edge);
      }
      html[data-login-card="right"] footer {
        justify-content: end;
        padding-inline-end: var(--login-card-edge);
      }
    }
    /* Prevent flash of the wrong auth method on load: keep the login form
       invisible (space reserved, so no layout shift) until JS has applied the
       configured auth methods, then reveal via .auth-ready. */
    #loginForm { visibility: hidden; }
    #loginForm.auth-ready { visibility: visible; }
    /* If login.js never runs (a failed load, a bad deploy), nothing adds
       .auth-ready and the form would stay hidden for good. So the form shows
       itself after 2.5 s anyway, and so does a hint to reload. Both apply
       only while login.js has not run: its first line marks <html
       data-login-js>, and from then on the script alone decides when the
       form shows (by then its submit is wired), so a slow page never shows a
       form Enter can't submit. The hint also goes once the form is ready. It
       takes no space until it shows. These are 0 s steps, not motion, so
       reduced motion keeps them. The form posts (method="post"): without
       script a submit puts nothing in the address bar. */
    html:not([data-login-js]) #loginForm { animation: login-fallback-show 0s linear 2.5s forwards; }
    #loginLoadHint { visibility: hidden; height: 0; overflow: hidden; animation: login-fallback-hint 0s linear 2.5s forwards; }
    #loginForm.auth-ready ~ #loginLoadHint,
    html[data-login-js] #loginLoadHint { display: none; }
    @keyframes login-fallback-show { to { visibility: visible; } }
    @keyframes login-fallback-hint { to { visibility: visible; height: auto; margin-top: 0.75rem; } }
</style>
</head>
<body class="bg-background-dark font-display min-h-screen relative flex flex-col overflow-y-auto">
<!-- Dynamic Backdrop Slideshow (hidden until JS loads images) -->
<div id="backdropSlideshow" class="fixed inset-0 z-0 hidden">
  <div id="backdropA" class="backdrop-slide opacity-0"></div>
  <div id="backdropB" class="backdrop-slide opacity-0"></div>
</div>
<!-- Cinematic Background Grid (fallback when TMDB slideshow not available) -->
<div id="staticPosterGrid" class="fixed inset-0 z-0">
    <div class="absolute inset-0 bg-gradient-to-br from-background-dark via-baltic-blue/20 to-background-dark"></div>
</div>
<!-- Dark Overlay -->
<div class="fixed inset-0 z-10 cinematic-overlay"></div>
<!-- Main Content Container -->
<main class="relative z-20 flex-1 flex flex-col items-center justify-center px-4">
<!-- Login Card -->
<div class="w-full max-w-[440px] login-glass-card rounded-xl p-8 flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-8 w-full flex flex-col items-center">
<img id="loginLogo" alt="Logo" class="h-48 w-auto object-contain border-none mb-2 hidden"/>
<h1 id="loginAppName" class="text-frosted-blue text-2xl font-bold mt-4 tracking-tight text-center">WebServarr</h1>
</div>
<!-- Login Form -->
<form id="loginForm" method="post" class="w-full space-y-5">
<div class="flex flex-col gap-1.5">
<label for="username" class="text-frosted-blue text-sm font-medium px-1">Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-frosted-blue/80 group-focus-within:text-frosted-blue text-h3" aria-hidden="true">person</span>
<input id="username" name="username" autocomplete="username" class="w-full bg-frosted-blue/5 border border-frosted-blue/10 rounded-lg py-3 pl-10 pr-4 text-frosted-blue placeholder:text-frosted-blue/70 focus:outline-none focus:ring-2 focus:ring-focus focus:border-transparent transition-all" placeholder="admin" type="text" required/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<label for="password" class="text-frosted-blue text-sm font-medium">Password</label>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-frosted-blue/80 group-focus-within:text-frosted-blue text-h3" aria-hidden="true">lock</span>
<input id="password" name="password" autocomplete="current-password" class="w-full bg-frosted-blue/5 border border-frosted-blue/10 rounded-lg py-3 pl-10 pr-4 text-frosted-blue placeholder:text-frosted-blue/70 focus:outline-none focus:ring-2 focus:ring-focus focus:border-transparent transition-all" placeholder="••••••••" type="password" required/>
</div>
</div>
<button type="submit" class="w-full bg-primary hover:bg-primary/90 text-bright font-bold py-3.5 rounded-lg transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
                    Sign in
                </button>
<!-- Divider -->
<div id="ssoDivider" class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-frosted-blue/10"></div>
<span class="text-frosted-blue/80 text-label font-semibold">Or continue with</span>
<div class="h-[1px] flex-1 bg-frosted-blue/10"></div>
</div>
<!-- Plex SSO Button -->
<button id="plexLoginBtn" class="w-full bg-[#E5A00D] hover:bg-[#cc8f0c] text-black font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-all active:scale-[0.98]" type="button">
<span class="text-sm font-medium">Sign in with</span>
<span class="font-black text-xl tracking-tight leading-none uppercase" style="font-family: 'Arial Black', 'Helvetica Neue', sans-serif">PLEX</span>
</button>
<!-- Authentik SSO Button (hidden by default, shown when configured) -->
<button id="authentikLoginBtn" class="hidden w-full bg-primary hover:bg-primary/90 text-bright font-bold py-3 rounded-lg flex flex-col items-center justify-center transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2 focus-visible:ring-offset-background-dark active:scale-[0.98]" type="button">
<div class="flex items-center gap-1.5">
<span class="text-sm font-medium">Sign in with</span>
