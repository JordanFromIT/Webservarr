<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>WebServarr - Reader</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
<style>
  /* The reader is a full-screen view inside the site's one document
     (<html data-shell="hidden">, set by the server: the sidebar, header and
     phone bar are hidden, #wsPlayer stays). The document scrolls, on every
     width, as it did when the reader was a page of its own: the shell's
     one-screen-tall <main> is let go while this page style is on (the router
     swaps it with the page). */
  html[data-shell="hidden"] body { overflow: visible; }
  /* A sample's banner holds its room from the first paint (theme-loader.js
     sets data-reader-sample); pages/reader.js fills it in. */
  html[data-reader-sample] #sampleBanner[hidden] { display: block; }
  html[data-shell="hidden"] #desktopSidebar ~ main { height: auto; max-height: none; overflow: visible; }

  /* Reader surface. Defaults are seeded from the site theme so a book opens
     matching the site, then the reader's own theme control takes over.
     The reader's own settings are set on #wsPage (pages/reader.js), so they
     go with the page. */
  :root {
    --reader-bg:   var(--hex-background, #000000);
    --reader-fg:   var(--hex-text, #BEEEF4);
    --reader-font-size: 18px;
    --reader-line-height: 1.7;
    --reader-measure: 42rem;
    --reader-columns: 1;
  }
  body { overscroll-behavior: none; }

  #readerSurface {
    background: var(--reader-bg);
    color: var(--reader-fg);
    transition: background .2s ease, color .2s ease;
  }

  /* Kavita's book CSS is namespaced under .book-content, and its annotation
     xPaths are stored relative to this element. The HTML inside must be
     inserted verbatim - style it, never restructure it. */
  /* Centre the column with the surface rather than margin:auto — Kavita's own
     book CSS sets margins on .book-content and wins otherwise. */
  #readerSurface { display: flex; flex-direction: column; align-items: center; }
  #readerSurface > * { width: 100%; }

  /* Reader-controlled typography uses the ID, not the class: Kavita injects its
     own <style> blocks scoped to .book-content inside this element, and at equal
     specificity those come later in document order and win. */
  #bookContent {
    max-width: var(--reader-measure);
    /* Bottom padding clears the slim footer plus any home-indicator inset. */
    padding: 2rem 1.25rem calc(3rem + env(safe-area-inset-bottom, 0px));
    column-count: var(--reader-columns);
    column-gap: 3rem;
  }
  #bookContent, #bookContent p, #bookContent div, #bookContent li, #bookContent span {
    font-size: var(--reader-font-size) !important;
    line-height: var(--reader-line-height) !important;
  }
  /* Headings scale with the body size rather than being pinned flat. */
  #bookContent h1 { font-size: calc(var(--reader-font-size) * 1.8) !important; }
  #bookContent h2 { font-size: calc(var(--reader-font-size) * 1.5) !important; }
  #bookContent h3 { font-size: calc(var(--reader-font-size) * 1.25) !important; }
  .book-content, .book-content * { color: var(--reader-fg) !important; }
  /* The page position and the jump total sit on the reading surface itself,
     so they take the reading colour. Bright text is for primary fills and
     vanished on the light and sepia reading modes. */
  .reader-meta { color: var(--reader-fg); opacity: .8; }
  .reader-meta:hover { opacity: 1; }
  /* Full-page art (covers, maps) should fit the screen instead of forcing a
     long scroll on what is visually a single image. */
  .book-content img {
    max-width: 100%;
    max-height: calc(100vh - 9rem);
    height: auto;
    display: block;
    margin-inline: auto;
    object-fit: contain;
  }
  .book-content a { text-decoration: underline; }
  .book-content h1, .book-content h2, .book-content h3 { line-height: 1.25; }

  /* Page turning is the primary interaction, so the whole left and right edges
     are clickable - not just a small button. Excludes the top bar so the
     controls there stay reachable. */
  .nav-zone {
    position: fixed;
    top: 3.5rem;
    bottom: var(--ws-player-h);
    width: 18%;
    min-width: 4.5rem;
    max-width: 14rem;
    z-index: 20;
    display: flex;
    align-items: center;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #navPrev { left: 0; justify-content: flex-start; padding-left: .5rem; }
  #navNext { right: 0; justify-content: flex-end; padding-right: .5rem; }

  /* The chevron sits vertically centred and stays quiet until you approach it. */
  .nav-zone .chev {
    display: flex; align-items: center; justify-content: center;
    width: 3.5rem; height: 3.5rem; border-radius: 9999px;
    background: rgb(var(--color-primary) / .18);
    /* Secondary text colour: the arrows sit over the page itself, and the
       primary tint disappeared against a light reading theme. */
    color: rgb(var(--color-text-secondary));
    opacity: .55;
    transition: opacity .18s ease, background .18s ease;
  }
  .nav-zone .chev .material-symbols-outlined { font-size: 2.25rem; }
  .nav-zone:hover .chev,
  .nav-zone:focus-visible .chev { opacity: 1; background: rgb(var(--color-primary) / .45); }
  .nav-zone:disabled { cursor: default; }
  /* Off while an error shows (showPanel): there is no page to turn. */
  .nav-zone[hidden] { display: none; }
  .nav-zone:disabled .chev { opacity: .12; }
  .nav-zone:focus-visible { outline: 2px solid rgb(var(--color-accent)); outline-offset: -4px; }

  @media (prefers-reduced-motion: reduce) { .nav-zone .chev { transition: none; } }

  /* On touch there is no hover, and a persistent chevron sits on top of the
     prose on a narrow screen. Keep the large tap target but hide the mark until
     the tap actually happens - standard e-reader behaviour. */
  @media (hover: none) {
    .nav-zone .chev { opacity: 0; }
    .nav-zone:active .chev { opacity: .8; }
  }

  /* ---- Phones ---- */
  @media (max-width: 640px) {
    /* Narrower edge targets so more of the line stays selectable, but still a
       comfortable thumb target at the screen edge. */
    .nav-zone { width: 22%; min-width: 3.25rem; }
    .nav-zone .chev { width: 2.25rem; height: 2.25rem; }
    #bookContent { padding-left: 1rem; padding-right: 1rem; }
    /* Settings is a panel on desktop and a bottom sheet on a phone. */
    #settingsPanel {
      top: auto; right: 0; left: 0; bottom: var(--ws-player-h);
      width: auto; max-height: 75vh; overflow-y: auto;
      border-radius: 1rem 1rem 0 0;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    }
  }

  /* Keep the fixed chrome clear of notches and home indicators. */
  #readerBar { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  #readerFooter { padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* The chrome fixed to the bottom ends above #wsPlayer while it shows
     (--ws-player-h is 0px while it is hidden, so nothing moves then): the
     page jump, the contents panel and, above, the page-turn edges and the
     phone's settings sheet. By id, so it beats the bottom-0 utility. */
  #readerFooter, #tocPanel { bottom: var(--ws-player-h); }

  #tocPanel { transition: transform .25s ease; }
  #tocPanel.closed { transform: translateX(-100%); }
  /* Firefox honours these; WebKit uses .custom-scrollbar from theme.css. */
  #tocPanel { scrollbar-width: thin; scrollbar-color: var(--hex-secondary) var(--hex-background); }

  /* Text scrolls beneath the footer, so fade it out into the reading surface -
     otherwise the page counter collides with the last visible line. Uses the
     reader background so it follows the chosen reading theme. */
  #readerFooter {
    background: linear-gradient(to bottom, transparent, var(--reader-bg) 55%);
    padding-top: 1.25rem;
  }

  /* Strip the number input's spinners - they crowd a 16px-wide field. */
  #pageJumpInput::-webkit-outer-spin-button,
  #pageJumpInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #pageJumpInput { -moz-appearance: textfield; appearance: textfield; }
  @media (prefers-reduced-motion: reduce) {
    #tocPanel, #readerSurface { transition: none; }
  }
  .toc-link.active { font-weight: 700; }
</style>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->
<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- ws:header -->
<!-- The page (spec 4.1), swapped by the router -->
<div id="wsPage" data-ws-module="/static/js/pages/reader.js?v=1" class="flex-1 flex flex-col">

<!-- Top bar -->
<header id="readerBar" class="fixed top-0 inset-x-0 z-30 h-14 bg-background-dark/95 backdrop-blur border-b border-steel-blue/25 flex items-center gap-2 px-3">
  <a id="readerBack" href="/books" class="p-2 rounded-lg hover:bg-baltic-blue/30" title="Back to Books" aria-label="Back to Books">
    <span class="material-symbols-outlined text-frosted-blue align-middle">arrow_back</span>
  </a>
  <button id="tocBtn" class="p-2 rounded-lg hover:bg-baltic-blue/30" title="Table of contents" aria-label="Table of contents">
    <span class="material-symbols-outlined text-frosted-blue align-middle">toc</span>
  </button>
  <h1 id="bookTitle" class="flex-1 min-w-0 truncate text-sm sm:text-base font-semibold text-frosted-blue px-1">Loading…</h1>
  <button id="bookmarkBtn" class="p-2 rounded-lg hover:bg-baltic-blue/30" title="Bookmark this page" aria-label="Bookmark this page">
    <span id="bookmarkIcon" class="material-symbols-outlined text-frosted-blue align-middle">bookmark_add</span>
  </button>
  <button id="settingsBtn" class="p-2 rounded-lg hover:bg-baltic-blue/30" title="Reading settings" aria-label="Reading settings">
    <span class="material-symbols-outlined text-frosted-blue align-middle">text_fields</span>
  </button>
  <button id="helpBtn" class="p-2 rounded-lg hover:bg-baltic-blue/30" title="How the reader works" aria-label="How the reader works">
    <span class="material-symbols-outlined text-frosted-blue align-middle">help</span>
  </button>
</header>

<!-- Table of contents -->
<aside id="tocPanel" class="closed custom-scrollbar fixed top-14 bottom-0 left-0 z-40 w-72 max-w-[85vw] ws-frost border-r overflow-y-auto p-4">
  <p class="text-label font-semibold text-frosted-blue/70 mb-3">Contents</p>
  <div id="tocList" class="space-y-1 text-sm"></div>
</aside>

<!-- Reading settings -->
<div id="settingsPanel" role="group" aria-label="Reading settings" class="ws-pop hidden fixed top-14 right-2 z-40 w-72 ws-frost border rounded-card p-4 space-y-4">
  <div>
    <p id="themeLabel" class="block text-label font-semibold text-frosted-blue/70 mb-2">Page colour</p>
    <div class="grid grid-cols-5 gap-1.5" id="themeButtons" role="group" aria-labelledby="themeLabel">
      <button type="button" data-theme="site"  aria-pressed="false" class="px-1 py-2 rounded-btn border border-frosted-blue/20 text-label text-frosted-blue">Site</button>
      <button type="button" data-theme="light" aria-pressed="false" class="px-1 py-2 rounded-btn border border-frosted-blue/20 text-label text-frosted-blue">Light</button>
      <button type="button" data-theme="sepia" aria-pressed="false" class="px-1 py-2 rounded-btn border border-frosted-blue/20 text-label text-frosted-blue">Sepia</button>
      <button type="button" data-theme="dark"  aria-pressed="false" class="px-1 py-2 rounded-btn border border-frosted-blue/20 text-label text-frosted-blue">Dark</button>
      <button type="button" data-theme="black" aria-pressed="false" class="px-1 py-2 rounded-btn border border-frosted-blue/20 text-label text-frosted-blue">Black</button>
    </div>
  </div>
  <div>
    <label for="fontSize" class="flex justify-between text-label font-semibold text-frosted-blue/70 mb-1">Text size <span id="fsVal" class="text-frosted-blue font-normal"></span></label>
    <input id="fontSize" type="range" min="14" max="28" step="1" class="wsp-range"/>
  </div>
  <div>
    <label for="lineHeight" class="flex justify-between text-label font-semibold text-frosted-blue/70 mb-1">Line spacing <span id="lhVal" class="text-frosted-blue font-normal"></span></label>
    <input id="lineHeight" type="range" min="12" max="24" step="1" class="wsp-range"/>
  </div>
  <div>
    <label for="measure" class="flex justify-between text-label font-semibold text-frosted-blue/70 mb-1">Line length <span id="mwVal" class="text-frosted-blue font-normal"></span></label>
    <input id="measure" type="range" min="28" max="70" step="2" class="wsp-range"/>
  </div>
  <div class="flex items-center justify-between">
    <span id="columnsLabel" class="text-label font-semibold text-frosted-blue/70">Two columns</span>
    <button id="columns" type="button" role="switch" aria-checked="false" aria-labelledby="columnsLabel" class="ws-switch"></button>
  </div>
</div>

<!-- Reading surface -->
<div id="readerSurface" class="pt-14 pb-6 min-h-screen">
  <!-- Sample mode only (pages/reader.js): nothing of this visit is saved. -->
  <div id="sampleBanner" hidden class="border-b border-steel-blue/25 bg-background-dark px-3 py-2">
    <div class="max-w-2xl mx-auto flex flex-wrap items-center gap-x-3 gap-y-2 text-sm">
      <span class="px-2.5 py-0.5 rounded-full bg-baltic-blue/30 text-label font-semibold text-frosted-blue">Sample</span>
      <span class="flex-1 min-w-[10rem] text-steel-blue">Your place and bookmarks aren’t saved.</span>
      <span class="flex items-center gap-2">
        <a id="sampleStart" href="/books" class="px-3 py-1.5 rounded-xl bg-baltic-blue/30 border border-steel-blue/30 text-frosted-blue hover:bg-baltic-blue/50">Start reading</a>
        <button id="sampleClose" type="button" class="px-3 py-1.5 rounded-xl border border-steel-blue/30 text-frosted-blue hover:bg-baltic-blue/30">Close</button>
      </span>
    </div>
  </div>
  <div id="loading" class="py-24 text-center">
    <span class="material-symbols-outlined animate-spin text-3xl text-steel-blue">progress_activity</span>
    <p id="loadingText" class="mt-2 text-sm text-steel-blue">Opening book…</p>
  </div>
  <!-- Try again shows only for the connection problem (showConnectProblem);
       a plain book error keeps just the way back. -->
  <div id="errorState" class="hidden py-24 text-center px-6" role="status">
    <span class="material-symbols-outlined text-4xl text-steel-blue/60" aria-hidden="true">error</span>
    <p id="errorTitle" class="mt-3 font-semibold text-frosted-blue">Couldn't open this book</p>
    <p id="errorDetail" class="mt-1 text-sm text-steel-blue max-w-md mx-auto"></p>
    <div class="mt-4 flex flex-wrap items-center justify-center gap-3">
      <button id="errorRetry" type="button" class="hidden px-4 py-2 rounded-xl bg-baltic-blue/30 border border-steel-blue/30
                                                   text-sm text-frosted-blue hover:bg-baltic-blue/50">Try again</button>
      <a href="/books" class="inline-block px-4 py-2 rounded-xl bg-baltic-blue/30 border border-steel-blue/30 text-sm text-frosted-blue">Back to Books</a>
    </div>
  </div>
  <!-- Kavita's HTML goes in here VERBATIM (annotation xPaths are relative to it) -->
  <div id="bookContent" class="book-content hidden"></div>
</div>

<!-- Page turning: full-height edge targets, chevron centred vertically -->
<button id="navPrev" class="nav-zone" aria-label="Previous page">
  <span class="chev"><span class="material-symbols-outlined">chevron_left</span></span>
</button>
<button id="navNext" class="nav-zone" aria-label="Next page">
  <span class="chev"><span class="material-symbols-outlined">chevron_right</span></span>
</button>

<!-- No bottom bar. Just the position, which doubles as the way to jump: click
     the number to type a page. Readers turn pages at the edges; nobody scrubs
     across a novel. -->
<footer id="readerFooter" class="fixed bottom-0 inset-x-0 z-30 pointer-events-none flex justify-center">
  <button id="pageInfo" type="button"
          class="pointer-events-auto reader-meta text-[13px] font-medium tabular-nums
                 px-3 py-1.5 rounded-md hover:bg-baltic-blue/25 transition-colors"
          title="Click to jump to a page" aria-label="Current page. Click to jump to a page."></button>
  <form id="pageJumpForm" class="pointer-events-auto hidden items-center gap-1.5 px-2 py-1">
    <input id="pageJumpInput" type="number" min="1" inputmode="numeric"
           class="w-16 bg-baltic-blue/20 border border-steel-blue/40 rounded-md px-2 py-0.5
                  text-[12px] text-frosted-blue text-center tabular-nums
                  focus:outline-none focus:ring-2 focus:ring-steel-blue"
           aria-label="Go to page"/>
    <span id="pageJumpTotal" class="reader-meta text-[13px] tabular-nums"></span>
  </form>
</footer>

</div>
</main>

<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
<script src="/static/js/tour.js?v=5" data-ws-page-script></script>
<script src="/static/js/kavita-connect.js?v=1" data-ws-page-script></script>
</body></html>
