<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Book</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->

<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- ws:header -->
<!-- One book (spec 4.2), swapped by the router -->
<div id="wsPage" data-ws-module="/static/js/pages/book.js?v=1" data-ws-dep="/static/js/pages/books.js?v=1" class="flex-1 flex flex-col min-h-0 lg:overflow-hidden [color-scheme:dark]">
<div class="flex-1 lg:overflow-y-auto p-4 lg:p-8 custom-scrollbar">
<div class="max-w-[1200px] w-full mx-auto min-w-0">

  <a id="backLink" href="/books" class="-ml-2 inline-flex items-center h-10 pl-1 pr-3 rounded-[10px] text-[15px] font-semibold text-frosted-blue/70 hover:text-frosted-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-frosted-blue">
    <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>Books
  </a>

  <!-- The cover, the title and everything under it arrive in one write
       (pages/book.js commit): the skeleton is their own shape, so nothing
       already on screen moves. The h1 stays; what follows it is replaced. -->
  <section id="bookView" data-arrive="book" aria-busy="true" class="mt-4 grid grid-cols-[minmax(0,1fr)] gap-6 sm:grid-cols-[14rem_minmax(0,1fr)] lg:grid-cols-[17rem_minmax(0,1fr)] sm:gap-8 lg:gap-12 items-start">
    <div id="bookCover" class="w-40 sm:w-full" aria-hidden="true">
      <div class="skel aspect-[2/3] rounded-xl"></div>
    </div>
    <div class="min-w-0">
      <h1 id="bookTitle" class="text-[24px] sm:text-[32px] lg:text-[44px] font-extrabold leading-[1.1] tracking-[-0.02em] text-balance break-words text-frosted-blue"><span class="skel-text">The title of the book</span></h1>
      <div id="bookRest" aria-hidden="true">
        <div class="mt-4 space-y-2">
          <div class="skel h-5 w-48 max-w-full"></div>
          <div class="skel h-5 w-64 max-w-full"></div>
        </div>
        <div class="mt-6 grid gap-3 sm:grid-cols-2 max-w-xl">
          <div><div class="skel h-14 rounded-[10px]"></div><div class="mt-2 h-10"></div></div>
          <div><div class="skel h-14 rounded-[10px]"></div><div class="mt-2 h-10"></div></div>
        </div>
        <!-- My list, Up next and the stars (pages/book.js mineBlock) -->
        <div class="mt-6 grid gap-3 sm:grid-cols-2 max-w-xl">
          <div class="skel h-11 rounded-[10px]"></div>
          <div class="skel h-11 rounded-[10px]"></div>
        </div>
        <div class="mt-5"><div class="h-[22.5px]"></div><div class="mt-1 skel h-10 w-[12.5rem] rounded-[10px]"></div></div>
        <div class="mt-8 max-w-[65ch] space-y-2">
          <div class="skel h-4"></div>
          <div class="skel h-4"></div>
          <div class="skel h-4"></div>
          <div class="skel h-4 w-2/3"></div>
        </div>
      </div>
    </div>
  </section>

</div>
</div>
</div>
</main>

<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
<script src="/static/js/kavita-connect.js?v=1" data-ws-page-script></script>
</body></html>
