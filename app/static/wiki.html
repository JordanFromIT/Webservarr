<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Wiki</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
<style>
  /* Rendered wiki body. Markdown produces bare tags, so the typographic scale
     lives here rather than as utility classes on elements we never author. */
  .wiki-body { line-height: 1.7; }
  .wiki-body h2 { font-size: 1.375rem; font-weight: 700; margin: 2rem 0 .75rem;
                  color: rgb(var(--color-text)); scroll-margin-top: 5rem; }
  .wiki-body h3 { font-size: 1.125rem; font-weight: 700; margin: 1.5rem 0 .5rem;
                  color: rgb(var(--color-text)); scroll-margin-top: 5rem; }
  .wiki-body p  { margin: 0 0 1rem; }
  .wiki-body ul, .wiki-body ol { margin: 0 0 1rem 1.25rem; }
  .wiki-body ul { list-style: disc; }
  .wiki-body ol { list-style: decimal; }
  .wiki-body li { margin: .35rem 0; }
  .wiki-body a  { color: rgb(var(--color-primary)); text-decoration: underline;
                  text-underline-offset: 2px; }
  .wiki-body code { font-family: ui-monospace, monospace; font-size: .875em;
                    background: rgb(var(--color-accent) / .15);
                    padding: .1em .35em; border-radius: .25rem; }
  .wiki-body pre { background: rgb(var(--color-accent) / .12);
                   border: 1px solid rgb(var(--color-accent) / .3);
                   border-radius: .5rem; padding: 1rem; overflow-x: auto;
                   margin: 0 0 1rem; }
  .wiki-body pre code { background: none; padding: 0; }
  .wiki-body blockquote { border-left: 3px solid rgb(var(--color-primary) / .5);
                          padding-left: 1rem; margin: 0 0 1rem;
                          color: rgb(var(--color-accent)); }
  .wiki-body img { max-width: 100%; height: auto; border-radius: .5rem;
                   margin: .5rem 0; }
  .wiki-body hr { border-color: rgb(var(--color-accent) / .3); margin: 1.5rem 0; }
  /* Wide tables scroll inside their own container rather than the page. */
  .wiki-body table { width: 100%; border-collapse: collapse; margin: 0 0 1rem;
                     display: block; overflow-x: auto; }
  .wiki-body th, .wiki-body td { border: 1px solid rgb(var(--color-accent) / .3);
                                 padding: .5rem .75rem; text-align: left; }
  .wiki-body th { background: rgb(var(--color-accent) / .12); font-weight: 700; }
  .wiki-body mark, .wiki-hit { background: rgb(var(--color-primary) / .35);
                               color: rgb(var(--color-text)); border-radius: .2rem;
                               padding: 0 .15em; }
  .wiki-skel { background: rgb(var(--color-accent) / .15); border-radius: .5rem;
               animation: wikiPulse 1.4s ease-in-out infinite; }
  @keyframes wikiPulse { 0%,100% { opacity: .5 } 50% { opacity: .9 } }
</style>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->

<div id="toastContainer" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-y-auto">
<!-- ws:header -->

<div id="wsPage" data-ws-module="/static/js/pages/wiki.js?v=1" class="flex-1 flex flex-col">
<div class="p-4 lg:p-8 max-w-5xl w-full mx-auto">
  <div id="wikiRoot">
    <!-- Skeleton reserves the final layout so nothing shifts when data lands.
         The title bar is the page's h1, so a soft navigation has a heading
         to focus before the view is drawn. -->
    <h1 class="wiki-skel h-8 w-48 mb-3"><span class="sr-only">Wiki</span></h1>
    <div class="wiki-skel h-4 w-72 mb-8"></div>
    <div class="wiki-skel h-12 w-full mb-8"></div>
    <div class="grid gap-4 sm:grid-cols-2">
      <div class="wiki-skel h-28"></div>
      <div class="wiki-skel h-28"></div>
      <div class="wiki-skel h-28"></div>
      <div class="wiki-skel h-28"></div>
    </div>
  </div>
</div>
</div>

</main>

<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
<script src="/static/js/wiki-categories.js?v=1" data-ws-page-script></script>
<script src="/static/js/wiki-editor.js?v=1" data-ws-page-script></script>
</body>
</html>
