<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - News</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
<style>
    /* News editor content (moved from the Settings page). Theme colours only. */
    #postContent {
        min-height: 300px;
        outline: none;
        caret-color: rgb(var(--color-text));
    }
    #postContent:empty::before {
        content: 'Start writing your content...';
        color: rgb(var(--color-accent) / 0.5);
        pointer-events: none;
    }
    #postContent h1 {
        font-size: 1.875rem;
        font-weight: 700;
        margin: 0.75rem 0 0.5rem;
        color: rgb(var(--color-text));
        line-height: 1.2;
    }
    #postContent h2 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0.75rem 0 0.5rem;
        color: rgb(var(--color-text));
        line-height: 1.3;
    }
    #postContent h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0.5rem 0 0.25rem;
        color: rgb(var(--color-text));
        line-height: 1.4;
    }
    #postContent p {
        margin: 0.5rem 0;
    }
    #postContent ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin: 0.5rem 0;
    }
    #postContent ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin: 0.5rem 0;
    }
    #postContent li {
        margin: 0.25rem 0;
    }
    #postContent blockquote {
        border-left: 3px solid rgb(var(--color-accent));
        padding-left: 1rem;
        margin: 0.75rem 0;
        color: rgb(var(--color-text) / 0.7);
        font-style: italic;
    }
    #postContent pre {
        background: rgb(var(--color-background) / 0.6);
        border: 1px solid rgb(var(--color-accent) / 0.3);
        border-radius: 0.5rem;
        padding: 1rem;
        margin: 0.75rem 0;
        overflow-x: auto;
        font-family: 'Courier New', monospace;
        font-size: 0.875rem;
        color: rgb(var(--color-text));
    }
    #postContent code {
        background: rgb(var(--color-background) / 0.4);
        border: 1px solid rgb(var(--color-accent) / 0.2);
        border-radius: 0.25rem;
        padding: 0.125rem 0.375rem;
        font-family: 'Courier New', monospace;
        font-size: 0.875rem;
        color: rgb(var(--color-text));
    }
    #postContent pre code {
        background: none;
        border: none;
        padding: 0;
        border-radius: 0;
    }
    #postContent a {
        color: rgb(var(--color-text));
        text-decoration: underline;
        text-underline-offset: 2px;
    }
    #postContent a:hover {
        color: rgb(var(--color-text));
    }
    #postContent img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin: 0.5rem 0;
    }
    #postContent hr {
        border: none;
        border-top: 1px solid rgb(var(--color-accent) / 0.3);
        margin: 1rem 0;
    }
    #postContent s, #postContent del {
        text-decoration: line-through;
        opacity: 0.7;
    }
    #postContent.preview-mode {
        background: rgb(var(--color-background) / 0.3);
        cursor: default;
    }
    .toolbar-btn.active {
        background: rgb(var(--color-primary) / 0.5);
        color: rgb(var(--color-text));
    }
</style>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->

<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- ws:header -->

<div id="wsPage" data-ws-module="/static/js/pages/news.js?v=1" class="flex-1 flex flex-col min-h-0 lg:overflow-y-auto lg:[scrollbar-gutter:stable]">
<div class="p-4 lg:p-8 max-w-4xl w-full mx-auto">

  <!-- Page header -->
  <div class="mb-6">
    <a href="/" class="inline-flex items-center gap-1 h-8 mb-2 text-label font-semibold text-frosted-blue/70 hover:text-frosted-blue transition-colors">
      <span class="material-symbols-outlined text-base" aria-hidden="true">chevron_left</span>Back to home
    </a>
    <div class="flex items-center gap-3 flex-wrap">
      <div class="min-w-0 flex-1">
        <h1 class="text-h2 sm:text-h1 font-extrabold leading-[1.1] tracking-[-0.02em] text-frosted-blue">News</h1>
        <p class="mt-2 text-body text-frosted-blue/70">Everything posted so far, newest first.</p>
      </div>
      <button id="newsNewPost" type="button" class="ws-admin-only inline-flex items-center gap-2 h-11 pl-4 pr-5 rounded-btn bg-primary text-bright text-body font-semibold hover:bg-primary/90 transition-colors">
        <span class="material-symbols-outlined text-xl" aria-hidden="true">add</span>New post
      </button>
    </div>
  </div>

  <div id="newsEditor" class="hidden mb-6"></div>

  <!-- Post list. Each skeleton card is renderCard's card with nothing in it:
       the same padding, the title (two lines held on a phone; one from sm),
       the quiet line (flag, date, byline), a two-line
       excerpt, the admins' Edit/Pin/Delete row (ws-admin-only, so it is there
       only when the real one will be) and Read more. So a card lands on its
       skeleton without anything inside moving. Change one, change both. -->
  <div id="newsArchive" class="grid gap-4" data-arrive="posts">
    <div class="skel rounded-2xl p-4 sm:p-5 min-w-0" aria-hidden="true"><div class="min-w-0 invisible"><p class="text-lead sm:text-h3 leading-snug font-bold min-h-12 sm:min-h-0">&nbsp;</p><p class="mt-1 text-label leading-5">&nbsp;</p><p class="text-body mt-1 min-h-12">&nbsp;</p><div class="ws-admin-only mt-2 -ml-2 flex flex-wrap gap-1"><span class="inline-flex items-center gap-1 h-8 px-2 text-label font-semibold"><span class="material-symbols-outlined text-base">edit</span>Edit</span></div><div class="mt-2 flex items-center gap-1 h-6 text-label font-semibold"><span>Read more</span><span class="material-symbols-outlined text-base">expand_more</span></div></div></div>
    <div class="skel rounded-2xl p-4 sm:p-5 min-w-0" aria-hidden="true"><div class="min-w-0 invisible"><p class="text-lead sm:text-h3 leading-snug font-bold min-h-12 sm:min-h-0">&nbsp;</p><p class="mt-1 text-label leading-5">&nbsp;</p><p class="text-body mt-1 min-h-12">&nbsp;</p><div class="ws-admin-only mt-2 -ml-2 flex flex-wrap gap-1"><span class="inline-flex items-center gap-1 h-8 px-2 text-label font-semibold"><span class="material-symbols-outlined text-base">edit</span>Edit</span></div><div class="mt-2 flex items-center gap-1 h-6 text-label font-semibold"><span>Read more</span><span class="material-symbols-outlined text-base">expand_more</span></div></div></div>
    <div class="skel rounded-2xl p-4 sm:p-5 min-w-0" aria-hidden="true"><div class="min-w-0 invisible"><p class="text-lead sm:text-h3 leading-snug font-bold min-h-12 sm:min-h-0">&nbsp;</p><p class="mt-1 text-label leading-5">&nbsp;</p><p class="text-body mt-1 min-h-12">&nbsp;</p><div class="ws-admin-only mt-2 -ml-2 flex flex-wrap gap-1"><span class="inline-flex items-center gap-1 h-8 px-2 text-label font-semibold"><span class="material-symbols-outlined text-base">edit</span>Edit</span></div><div class="mt-2 flex items-center gap-1 h-6 text-label font-semibold"><span>Read more</span><span class="material-symbols-outlined text-base">expand_more</span></div></div></div>
  </div>

  <!-- Pagination -->
  <div class="flex justify-center mt-6">
    <button id="newsLoadMore" type="button"
      class="hidden items-center gap-2 h-10 px-5 rounded-btn bg-frosted-blue/[0.07] text-frosted-blue text-body font-semibold hover:bg-frosted-blue/10 transition-colors">
      <span class="material-symbols-outlined text-lg" aria-hidden="true">expand_more</span>
      <span id="newsLoadMoreText">Load older posts</span>
    </button>
  </div>

</div>
</div>

</main>

<!-- Scripts -->
<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
<script src="/static/js/news-editor.js?v=1" data-ws-page-script></script>
</body>
</html>
