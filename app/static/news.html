<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - News</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
<style>
    /* News editor content (moved from the Settings page). Theme colours only. */
    #postContent {
        min-height: 300px;
        outline: none;
        caret-color: rgb(var(--color-text));
    }
    #postContent:empty::before {
        content: 'Start writing your content...';
        color: rgb(var(--color-accent) / 0.5);
        pointer-events: none;
    }
    #postContent h1 {
        font-size: 1.875rem;
        font-weight: 700;
        margin: 0.75rem 0 0.5rem;
        color: rgb(var(--color-text));
        line-height: 1.2;
    }
    #postContent h2 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0.75rem 0 0.5rem;
        color: rgb(var(--color-text));
        line-height: 1.3;
    }
    #postContent h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0.5rem 0 0.25rem;
        color: rgb(var(--color-text));
        line-height: 1.4;
    }
    #postContent p {
        margin: 0.5rem 0;
    }
    #postContent ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin: 0.5rem 0;
    }
    #postContent ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin: 0.5rem 0;
    }
    #postContent li {
        margin: 0.25rem 0;
    }
    #postContent blockquote {
        border-left: 3px solid rgb(var(--color-accent));
        padding-left: 1rem;
        margin: 0.75rem 0;
        color: rgb(var(--color-text) / 0.7);
        font-style: italic;
    }
    #postContent pre {
        background: rgb(var(--color-background) / 0.6);
        border: 1px solid rgb(var(--color-accent) / 0.3);
        border-radius: 0.5rem;
        padding: 1rem;
        margin: 0.75rem 0;
        overflow-x: auto;
        font-family: 'Courier New', monospace;
        font-size: 0.875rem;
        color: rgb(var(--color-text));
    }
    #postContent code {
        background: rgb(var(--color-background) / 0.4);
        border: 1px solid rgb(var(--color-accent) / 0.2);
        border-radius: 0.25rem;
        padding: 0.125rem 0.375rem;
        font-family: 'Courier New', monospace;
        font-size: 0.875rem;
        color: rgb(var(--color-text));
    }
    #postContent pre code {
        background: none;
        border: none;
        padding: 0;
        border-radius: 0;
    }
    #postContent a {
        color: rgb(var(--color-text));
        text-decoration: underline;
        text-underline-offset: 2px;
    }
    #postContent a:hover {
        color: rgb(var(--color-text));
    }
    #postContent img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin: 0.5rem 0;
    }
    #postContent hr {
        border: none;
        border-top: 1px solid rgb(var(--color-accent) / 0.3);
        margin: 1rem 0;
    }
    #postContent s, #postContent del {
        text-decoration: line-through;
        opacity: 0.7;
    }
    #postContent.preview-mode {
        background: rgb(var(--color-background) / 0.3);
        cursor: default;
    }
    .toolbar-btn.active {
        background: rgb(var(--color-primary) / 0.5);
        color: rgb(var(--color-text));
    }
</style>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->

<!-- Toast notification container -->
<div id="toastContainer" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-y-auto">
<!-- ws:header -->

<div class="p-4 lg:p-8 max-w-4xl w-full mx-auto">

  <!-- Page header -->
  <div class="mb-6">
    <a href="/" class="inline-flex items-center gap-1 text-sm font-bold text-steel-blue hover:text-primary transition-colors mb-3">
      <span class="material-symbols-outlined text-sm">chevron_left</span>Back to home
    </a>
    <div class="flex items-center gap-3 flex-wrap">
      <span class="material-symbols-outlined text-steel-blue text-3xl">newspaper</span>
      <div class="min-w-0 flex-1">
        <h1 class="text-2xl lg:text-3xl font-bold text-frosted-blue leading-tight">News &amp; Updates</h1>
        <p class="text-sm text-steel-blue mt-0.5">Everything posted so far, newest first.</p>
      </div>
      <button id="newsNewPost" type="button" class="ws-admin-only inline-flex items-center gap-2 px-4 py-2.5 rounded-[10px] bg-primary text-bright text-sm font-semibold hover:bg-primary/90 transition-colors">
        <span class="material-symbols-outlined text-base" aria-hidden="true">add</span>New post
      </button>
    </div>
  </div>

  <div id="newsEditor" class="hidden mb-6"></div>

  <!-- Post list. Each skeleton card is renderCard's card with nothing in it:
       the same border and padding, the title (two lines on a phone, where
       most wrap beside the date; one from sm), the byline, a two-line
       excerpt, the admins' Edit/Pin/Delete row (ws-admin-only, so it is there
       only when the real one will be) and Read more. So a card lands on its
       skeleton without anything inside moving. Change one, change both. -->
  <div id="newsArchive" class="grid gap-3" data-arrive="posts">
    <div class="skel rounded-xl p-4 flex items-start gap-4 border border-l-4 border-transparent min-w-0" aria-hidden="true"><span class="size-6 mt-0.5 shrink-0"></span><div class="flex-1 min-w-0 invisible"><p class="font-bold min-h-12 sm:min-h-0">&nbsp;</p><p class="text-xs mt-0.5">&nbsp;</p><p class="text-sm mt-1 min-h-10">&nbsp;</p><div class="ws-admin-only mt-2 -ml-2 flex flex-wrap gap-1"><span class="inline-flex items-center gap-1 px-2 py-1 text-sm font-semibold"><span class="material-symbols-outlined text-base">edit</span>Edit</span></div><div class="mt-2 flex items-center gap-1 text-[11px] font-bold"><span>Read more</span><span class="material-symbols-outlined text-sm">expand_more</span></div></div></div>
    <div class="skel rounded-xl p-4 flex items-start gap-4 border border-l-4 border-transparent min-w-0" aria-hidden="true"><span class="size-6 mt-0.5 shrink-0"></span><div class="flex-1 min-w-0 invisible"><p class="font-bold min-h-12 sm:min-h-0">&nbsp;</p><p class="text-xs mt-0.5">&nbsp;</p><p class="text-sm mt-1 min-h-10">&nbsp;</p><div class="ws-admin-only mt-2 -ml-2 flex flex-wrap gap-1"><span class="inline-flex items-center gap-1 px-2 py-1 text-sm font-semibold"><span class="material-symbols-outlined text-base">edit</span>Edit</span></div><div class="mt-2 flex items-center gap-1 text-[11px] font-bold"><span>Read more</span><span class="material-symbols-outlined text-sm">expand_more</span></div></div></div>
    <div class="skel rounded-xl p-4 flex items-start gap-4 border border-l-4 border-transparent min-w-0" aria-hidden="true"><span class="size-6 mt-0.5 shrink-0"></span><div class="flex-1 min-w-0 invisible"><p class="font-bold min-h-12 sm:min-h-0">&nbsp;</p><p class="text-xs mt-0.5">&nbsp;</p><p class="text-sm mt-1 min-h-10">&nbsp;</p><div class="ws-admin-only mt-2 -ml-2 flex flex-wrap gap-1"><span class="inline-flex items-center gap-1 px-2 py-1 text-sm font-semibold"><span class="material-symbols-outlined text-base">edit</span>Edit</span></div><div class="mt-2 flex items-center gap-1 text-[11px] font-bold"><span>Read more</span><span class="material-symbols-outlined text-sm">expand_more</span></div></div></div>
  </div>

  <!-- Pagination -->
  <div class="flex justify-center mt-6">
    <button id="newsLoadMore" type="button"
      class="hidden items-center gap-2 px-5 py-2.5 rounded-lg bg-primary/15 text-primary border border-primary/30 text-sm font-bold hover:bg-primary/25 transition-all">
      <span class="material-symbols-outlined text-base">expand_more</span>
      <span id="newsLoadMoreText">Load older posts</span>
    </button>
  </div>

</div>

</main>

<!-- Scripts -->
<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
<script src="/static/js/ui.js?v=1"></script>
<script src="/static/js/news-editor.js?v=1"></script>
<script>
// WebServarr — News Archive
//
// The counterpart to the homepage feed. The homepage deliberately shows only a
// handful of recent posts and retires anything past the configured age window;
// this page is where those posts keep living. No age filter, no cap — just
// pagination, so the list can grow indefinitely without the homepage doing so.
(function () {
  'use strict';

  var PAGE_SIZE = 20;
  var FRESH_MS = 72 * 60 * 60 * 1000; // matches the homepage's "New" threshold
  var _offset = 0;
  var _loading = false;
  var _reloadAfter = false;
  // Bumped by every reload(). A page started before the latest reload (a
  // "Load older posts" still in flight when a write landed) is dropped when
  // it answers, so it can never paint the pre-write list.
  var _gen = 0;
  // Bumped by every Edit and New post click. Edit fetches the post before the
  // editor opens, so an older click whose answer lands late is ignored: the
  // panel shown is always the one asked for last.
  var _editClick = 0;
  // Admins see drafts too, and manage every post in place. The server decides
  // who gets drafts (published_only=false is ignored for anyone else); this
  // only chooses what to ask for and whether to draw the tools.
  var isAdmin = !!(window.WS && WS.user && WS.user.is_admin);

  var listEl = document.getElementById('newsArchive');
  var moreBtn = document.getElementById('newsLoadMore');
  var moreText = document.getElementById('newsLoadMoreText');

  function excerpt(html, limit) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    var text = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
    return text.length > limit ? text.slice(0, limit).trimEnd() + '…' : text;
  }

  function dateLabel(date) {
    var secondsAgo = Math.floor((Date.now() - date.getTime()) / 1000);
    if (secondsAgo < 60) return 'Just now';
    if (secondsAgo < 3600) return Math.floor(secondsAgo / 60) + 'm ago';
    if (secondsAgo < 86400) return Math.floor(secondsAgo / 3600) + 'h ago';
    if (secondsAgo < 604800) return Math.floor(secondsAgo / 86400) + 'd ago';
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Same card shape as the homepage so a post is recognisable in both places.
  // The skeleton cards in #newsArchive copy this card's geometry.
  // Archive cards start collapsed regardless of age — this is a list to scan,
  // not a feed to read straight through.
  function renderCard(post) {
    var created = new Date(post.created_at);
    var isFresh = (Date.now() - created.getTime()) < FRESH_MS;
    var accent = post.pinned ? 'border-l-primary' : (isFresh ? 'border-l-frosted-blue' : 'border-l-steel-blue/40');
    var icon = post.pinned ? 'push_pin' : (isFresh ? 'campaign' : 'article');
    var iconColor = post.pinned ? 'text-primary' : (isFresh ? 'text-frosted-blue' : 'text-steel-blue');

    var flag = '';
    if (post.pinned) {
      flag = '<span class="shrink-0 mt-0.5 text-[9px] font-bold tracking-wider uppercase px-1.5 py-0.5 rounded bg-primary/20 text-primary">Pinned</span>';
    } else if (isFresh) {
      flag = '<span class="shrink-0 mt-0.5 text-[9px] font-bold tracking-wider uppercase px-1.5 py-0.5 rounded bg-frosted-blue/15 text-frosted-blue">New</span>';
    }
    if (!post.published) {
      flag = '<span class="shrink-0 mt-0.5 text-xs font-bold tracking-wider uppercase px-1.5 py-0.5 rounded bg-frosted-blue/10 text-frosted-blue/70">Draft</span>' + flag;
    }
    var id = escapeHtml(String(post.id));

    var bodyClasses = 'text-sm text-frosted-blue/80 mt-2 prose prose-invert max-w-none [&>div]:mb-2 [&>p]:mb-2 [&_br]:block';

    // min-w-0: see the matching note on the homepage renderer. Grid items
    // default to min-width:auto and will otherwise overflow the page on mobile.
    // The min-h on the title (phone) and the excerpt keep a short post the
    // height of its skeleton card.
    return '<div class="glass-card p-4 rounded-xl flex items-start gap-4 border-l-4 min-w-0 ' + accent + '">' +
      '<span class="material-symbols-outlined ' + iconColor + ' mt-0.5 shrink-0">' + icon + '</span>' +
      '<div class="flex-1 min-w-0">' +
        '<div class="flex items-start justify-between gap-3">' +
          '<div class="flex items-start gap-2 min-w-0">' +
            flag +
            '<h2 class="font-bold text-frosted-blue break-words min-w-0 min-h-12 sm:min-h-0">' + escapeHtml(post.title) + '</h2>' +
          '</div>' +
          '<span class="shrink-0 text-[10px] text-steel-blue font-bold uppercase">' + escapeHtml(dateLabel(created)) + '</span>' +
        '</div>' +
        '<p class="text-xs text-steel-blue/70 mt-0.5">By ' + escapeHtml(post.author_name || 'Unknown') + '</p>' +
        '<p class="text-sm text-frosted-blue/60 mt-1 line-clamp-2 min-h-10">' + escapeHtml(excerpt(post.content_html, 180)) + '</p>' +
        '<div class="' + bodyClasses + ' hidden" data-news-body style="white-space:pre-line">' + post.content_html + '</div>' +
        (isAdmin
          ? '<div class="mt-2 -ml-2 flex flex-wrap gap-1">' +
              '<button type="button" data-news-action="edit" data-id="' + id + '" class="inline-flex items-center gap-1 px-2 py-1 rounded-[8px] text-sm font-semibold text-frosted-blue/70 hover:text-frosted-blue hover:bg-frosted-blue/[0.06]"><span class="material-symbols-outlined text-base" aria-hidden="true">edit</span>Edit</button>' +
              '<button type="button" data-news-action="pin" data-id="' + id + '" data-pinned="' + (post.pinned ? '1' : '0') + '" class="inline-flex items-center gap-1 px-2 py-1 rounded-[8px] text-sm font-semibold text-frosted-blue/70 hover:text-frosted-blue hover:bg-frosted-blue/[0.06]"><span class="material-symbols-outlined text-base" aria-hidden="true">push_pin</span>' + (post.pinned ? 'Unpin' : 'Pin') + '</button>' +
              '<button type="button" data-news-action="delete" data-id="' + id + '" data-title="' + escapeHtml(post.title) + '" class="inline-flex items-center gap-1 px-2 py-1 rounded-[8px] text-sm font-semibold text-frosted-blue/70 hover:text-frosted-blue hover:bg-frosted-blue/[0.06]"><span class="material-symbols-outlined text-base" aria-hidden="true">delete</span>Delete</button>' +
            '</div>'
          : '') +
        '<button type="button" data-news-toggle class="mt-2 flex items-center gap-1 text-[11px] font-bold text-steel-blue hover:text-primary transition-colors">' +
          '<span data-news-toggle-text>Read more</span>' +
          '<span class="material-symbols-outlined text-sm transition-transform" data-news-chevron>expand_more</span>' +
        '</button>' +
      '</div>' +
    '</div>';
  }

  // Delegated so it keeps working for cards appended by "Load older posts".
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-news-toggle]') : null;
    if (!btn) return;
    var card = btn.parentElement;
    var full = card.querySelector('[data-news-body]');
    var teaser = card.querySelector('.line-clamp-2');
    if (!full) return;
    var nowOpen = full.classList.toggle('hidden') === false;
    if (teaser) teaser.classList.toggle('hidden', nowOpen);
    btn.querySelector('[data-news-toggle-text]').textContent = nowOpen ? 'Show less' : 'Read more';
    btn.querySelector('[data-news-chevron]').style.transform = nowOpen ? 'rotate(180deg)' : '';
  });

  function emptyState() {
    return '<div class="text-center text-steel-blue py-12">' +
      '<span class="material-symbols-outlined text-4xl mb-2 block opacity-50">newspaper</span>' +
      '<p>No news posts yet.</p>' +
    '</div>';
  }

  // fresh: skip the cached copy and paint the server's answer (after a write).
  async function loadPage(fresh) {
    if (_loading) {
      if (fresh === true) _reloadAfter = true;   // a write landed mid-load: reload once it ends
      return;
    }
    _loading = true;
    fresh = fresh === true;
    moreText.textContent = 'Loading…';

    var offset = _offset;
    var gen = _gen;
    // Fetch one past the page size: if it comes back, there is another page.
    // Cheaper than a separate count query and never goes stale against it.
    var url = '/api/news/?limit=' + (PAGE_SIZE + 1) + '&offset=' + offset + (isAdmin ? '&published_only=false' : '');
    var key = isAdmin ? 'news:archive:admin' : 'news:archive';

    function fetcher() {
      return WS.getJSON(url).then(function (posts) {
        if (!Array.isArray(posts)) throw new Error('Unexpected response');
        return posts;
      });
    }

    function render(posts) {
      if (gen !== _gen) return;
      var hasMore = posts.length > PAGE_SIZE;
      var page = posts.slice(0, PAGE_SIZE);

      if (offset === 0) {
        WS.arrive('posts', function () {
          WS.setHTML(listEl, page.length ? page.map(renderCard).join('') : emptyState());
        });
        _offset = page.length;
      } else {
        listEl.insertAdjacentHTML('beforeend', page.map(renderCard).join(''));
        _offset = offset + page.length;
      }

      moreBtn.classList.toggle('hidden', !hasMore);
      moreBtn.classList.toggle('flex', hasMore);
      moreText.textContent = 'Load older posts';
    }

    try {
      if (offset === 0) {
        // The first page paints from the last visit at once, then refreshes.
        var got = await WS.swr(key, fetcher, render, fresh ? { maxAge: 0 } : undefined);
        if (got === null) throw new Error('Request failed');
      } else {
        render(await fetcher());
      }
    } catch (err) {
      if (gen !== _gen) return;
      console.error('Error loading news archive:', err);
      if (offset === 0) {
        WS.arrive('posts', function () {
          WS.setHTML(listEl, '<div class="text-center text-steel-blue py-12">' +
            '<span class="material-symbols-outlined text-4xl mb-2 block opacity-50">cloud_off</span>' +
            '<p>Could not load news right now.</p>' +
            '<p class="text-xs opacity-60 mt-1">Try refreshing the page.</p>' +
          '</div>');
        });
      }
      moreText.textContent = 'Try again';
    } finally {
      _loading = false;
      if (_reloadAfter) { _reloadAfter = false; reload(); }
    }
  }

  moreBtn.addEventListener('click', function () { loadPage(); });

  // ---- Admin: manage posts in place ----

  // Back to the first page, fetched fresh (never the cached copy).
  function reload() {
    _gen += 1;
    _offset = 0;
    loadPage(true);
  }

  // After every successful write: prefetched or prerendered copies of / and
  // /news, and this user's cached news lists, all predate it.
  function newsChanged() {
    WS.clearPageCache();
    WS.dropCache('news:');
    reload();
  }

  function write(btn, url, init, okText, errText) {
    btn.disabled = true;
    fetch(url, init).then(function (r) {
      if (r.status === 401) { window.location.href = '/login'; return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      WSUI.toast(okText, 'ok');
      newsChanged();
    }).catch(function () {
      WSUI.toast(errText, 'err');
    }).then(function () { btn.disabled = false; });
  }

  document.getElementById('newsNewPost').addEventListener('click', function () {
    if (!isAdmin) return;
    _editClick += 1;
    NewsEditor.open(null, newsChanged);
  });

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-news-action]') : null;
    if (!btn || !isAdmin) return;
    var id = parseInt(btn.getAttribute('data-id'), 10);
    var action = btn.getAttribute('data-news-action');
    if (action === 'edit') {
      // Opens (or reports a failure) only if this is still the latest Edit
      // click and nothing opened or dismissed the editor meanwhile.
      var ticket = ++_editClick, seen = NewsEditor.generation();
      WS.getJSON('/api/news/' + id).then(function (post) {
        if (ticket === _editClick && seen === NewsEditor.generation()) NewsEditor.open(post, newsChanged);
      }).catch(function () {
        if (ticket === _editClick && seen === NewsEditor.generation()) WSUI.toast('That post couldn’t be opened. Try again.', 'err');
      });
    } else if (action === 'pin') {
      var pinned = btn.getAttribute('data-pinned') === '1';
      write(btn, '/api/news/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                                     body: JSON.stringify({ pinned: !pinned }) },
            pinned ? 'Unpinned.' : 'Pinned to the top.', 'That didn’t work. Try again.');
    } else if (action === 'delete') {
      WSUI.confirm({ title: 'Delete this post?', body: '“' + btn.getAttribute('data-title') + '” will be gone for everyone. This can’t be undone.',
                     confirmLabel: 'Delete post', cancelLabel: 'Keep it', danger: true }).then(function (ok) {
        if (!ok) return;
        write(btn, '/api/news/' + id, { method: 'DELETE' }, 'Post deleted.', 'The post wasn’t deleted. Try again.');
      });
    }
  });

  // ---- Init ----

  checkAuth().then(function () {
    loadPage();
  });
})();
</script>
</body>
</html>
