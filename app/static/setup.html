<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Setup</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
<style>
    .login-glass-card {
      background: rgb(var(--color-background) / 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(var(--color-accent) / 0.15);
    }
    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .step-circle.active {
      background: rgb(var(--color-primary));
      color: rgb(var(--color-text-secondary));
    }
    .step-circle.completed {
      background: rgb(var(--color-primary));
      color: rgb(var(--color-text-secondary));
    }
    .step-circle.inactive {
      background: rgb(var(--color-accent) / 0.2);
      color: rgb(var(--color-text) / 0.6);
    }
    .step-line {
      height: 2px;
      flex: 1;
      transition: background 0.3s ease;
    }
    .step-line.active {
      background: rgb(var(--color-primary));
    }
    .step-line.inactive {
      background: rgb(var(--color-accent) / 0.2);
    }
</style>
</head>
<body class="bg-background-dark font-display min-h-screen relative flex flex-col overflow-y-auto">
<!-- Dark Background -->
<div class="fixed inset-0 z-0">
    <div class="absolute inset-0 bg-gradient-to-br from-background-dark via-baltic-blue/20 to-background-dark"></div>
</div>
<div class="fixed inset-0 z-10" style="background: radial-gradient(circle, rgb(var(--color-background) / 0.4) 0%, rgb(var(--color-background) / 0.9) 100%);"></div>
<!-- Main Content -->
<main class="relative z-20 flex-1 flex flex-col items-center justify-center px-4 py-8">
<div class="w-full max-w-[500px] login-glass-card rounded-xl p-8 shadow-2xl flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-6 flex flex-col items-center">
<img id="setupLogo" alt="Logo" class="h-32 w-auto object-contain border-none mb-2 hidden"/>
<h1 id="setupAppName" class="text-frosted-blue text-2xl font-bold mt-2 tracking-tight text-center">WebServarr Setup</h1>
</div>
<!-- Stepper -->
<div id="stepper" class="flex items-center w-full mb-8 px-4"></div>
<!-- Step Content Container -->
<div id="stepContent" class="w-full"></div>
<!-- Navigation Buttons -->
<div id="navButtons" class="w-full flex gap-3 mt-6"></div>
<!-- Error Message -->
<div id="setupError" class="text-status-err-text text-sm text-center mt-3 hidden"></div>
</div>
</main>

<script src="/static/js/setup.js?v=1"></script>

</body></html>
