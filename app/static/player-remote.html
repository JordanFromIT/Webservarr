<!DOCTYPE html>
<html class="dark" lang="en" data-shell="hidden">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Player</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
</head>
<body class="bg-background-dark text-frosted-blue wsr-body">
<!-- The player's remote window (app/main.py /player/remote): Pop out opens it
     where the browser has no always-on-top window for pages. A remote control
     for the tab that opened it (js/player-remote.js builds it in #wsRemote);
     data-shell="hidden": no shell, no tab bar to make room for. The player
     modules below are loaded only by "Play here", in the shell's order, from
     these content-stamped addresses; until then nothing plays here. -->
<main id="wsRemote" class="wsr"></main>
<div id="wsPlayer" hidden></div>
<div id="wsLive" class="sr-only" aria-live="polite"></div>
<div hidden>
  <span data-ws-dep="/static/js/player/saves.js?v=1"></span>
  <span data-ws-dep="/static/js/player/engine.js?v=1"></span>
  <span data-ws-dep="/static/js/player/ui.js?v=1"></span>
  <span data-ws-dep="/static/js/player/features.js?v=1"></span>
  <span data-ws-dep="/static/js/player/findplace.js?v=1"></span>
  <span data-ws-dep="/static/js/player/safetynet.js?v=1"></span>
</div>
<script type="module" src="/static/js/player-remote.js?v=1"></script>
</body>
</html>
