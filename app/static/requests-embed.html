<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Requests</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js"></script>
<script src="/static/js/shell-cache.js?v=1"></script>
<link rel="stylesheet" href="/static/css/tailwind.css?v=1">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden" data-page="requests-embed">
<!--WEBSERVARR:SHELL-->
<!-- Main Content Area -->
<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- Seerr Iframe -->
<div class="flex-1 overflow-hidden">
<div id="iframeContainer" class="w-full h-full">
<div id="iframePlaceholder" class="flex flex-col items-center justify-center h-full text-center text-steel-blue p-8">
<span class="material-symbols-outlined text-6xl mb-4 opacity-50">download</span>
<p class="text-lg mb-2">Loading Seerr...</p>
<p class="text-sm">If Seerr is not configured, set the URL in Settings > Integrations.</p>
</div>
</div>
</div>
</main>

<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/header.js?v=2"></script>
<script src="/static/js/sidebar.js?v=21"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    const user = await checkAuth();
    if (!user) return;
    showAdminNav(user.is_admin);
    loadSystemStatus();

    // Authenticate with Seerr SSO before loading iframe
    try {
        await fetch('/api/integrations/seerr-auth', { method: 'POST' });
    } catch (e) { /* SSO optional — iframe will show Seerr login if it fails */ }

    // Load Seerr URL from settings
    try {
        const resp = await fetch('/api/integrations/seerr-url');
        if (resp.ok) {
            const data = await resp.json();
            if (data.url) {
                const container = document.getElementById('iframeContainer');
                container.innerHTML = '<iframe src="' + data.url + '" class="w-full h-full border-0" allow="fullscreen"></iframe>';
            }
        }
    } catch (e) {
        // Seerr not configured — keep placeholder
    }
});
</script>
</body>
</html>
