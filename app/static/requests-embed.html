<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Requests</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->
<!-- Main Content Area -->
<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- ws:header -->
<!-- Seerr Iframe -->
<div class="flex-1 overflow-hidden">
<div id="iframeContainer" class="w-full h-full">
<div id="iframePlaceholder" class="h-full p-4 lg:p-8">
<div class="skel w-full h-full rounded-2xl" aria-hidden="true"></div>
</div>
</div>
</div>
</main>

<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {

    const user = await checkAuth();
    if (!user) return;

    // The SSO handshake has side effects, so it waits until the page is
    // actually on screen (a prerendered page must not sign in on its own).
    WS.whenActive(async function () {
        // Authenticate with Seerr SSO before loading iframe
        try {
            await fetch('/api/integrations/seerr-auth', { method: 'POST' });
        } catch (e) { /* SSO optional — iframe will show Seerr login if it fails */ }

        // Load Seerr URL from settings
        const container = document.getElementById('iframeContainer');
        var url = '';
        try {
            const resp = await fetch('/api/integrations/seerr-url');
            if (resp.ok) url = ((await resp.json()) || {}).url || '';
        } catch (e) { /* not configured */ }
        if (url) {
            container.innerHTML = '<iframe src="' + url + '" class="w-full h-full border-0" allow="fullscreen"></iframe>';
        } else {
            container.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-center text-steel-blue p-8">' +
                '<span class="material-symbols-outlined text-6xl mb-4 opacity-50">download</span>' +
                '<p class="text-lg mb-2">The embedded requests page is not set up yet</p>' +
                '<p class="text-sm">Set the Seerr URL in Settings > Integrations.</p></div>';
        }
    });
});
</script>
</body>
</html>
