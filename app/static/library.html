<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Library</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="/static/css/theme.css?v=4" rel="stylesheet"/>
<script>tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "rgb(var(--color-primary) / <alpha-value>)",
        "baltic-blue": "rgb(var(--color-primary) / <alpha-value>)",
        "cornflower-ocean": "rgb(var(--color-secondary) / <alpha-value>)",
        "steel-blue": "rgb(var(--color-accent) / <alpha-value>)",
        "frosted-blue": "rgb(var(--color-text) / <alpha-value>)",
        "bright": "rgb(var(--color-text-secondary) / <alpha-value>)",
        "background-dark": "rgb(var(--color-background) / <alpha-value>)",
      },
      fontFamily: {
        "display": ["var(--font-display)", "sans-serif"]
      },
    },
  },
}</script>
<style>
  /* Cover aspect ratio kept stable so the grid never reflows as images land. */
  .book-cover { aspect-ratio: 2 / 3; }
  .book-card:hover .book-cover-img { transform: scale(1.04); }
  .book-cover-img { transition: transform .35s ease; }
  @media (prefers-reduced-motion: reduce) {
    .book-cover-img { transition: none; }
    .book-card:hover .book-cover-img { transform: none; }
  }
</style>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<div id="sidebar-root" class="lg:w-64 lg:shrink-0"></div>

<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<div id="header-root" class="hidden lg:block lg:h-16"></div>

<div class="flex-1 lg:overflow-y-auto p-4 lg:p-8 custom-scrollbar space-y-8">


  <!-- Discovery shelves: continue reading, recently added, top rated -->
  <div id="shelves" class="space-y-8"></div>

  <!-- Library -->
  <section>
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <span id="iconLibrary" class="material-symbols-outlined text-steel-blue">menu_book</span>
      <h3 class="text-xl font-bold text-frosted-blue">Library</h3>
      <span id="libraryCount" class="text-[11px] text-steel-blue"></span>
      <button id="helpBtn" title="How eBooks works" aria-label="How eBooks works"
              class="p-1 rounded-lg text-steel-blue hover:text-frosted-blue hover:bg-baltic-blue/30 transition-colors">
        <span class="material-symbols-outlined text-[20px]">help</span>
      </button>
      <div class="ml-auto relative">
        <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-steel-blue text-[18px]">search</span>
        <input id="searchInput" type="search" placeholder="Search books…" autocomplete="off"
               class="bg-baltic-blue/10 border border-steel-blue/30 rounded-xl pl-8 pr-3 py-2 text-sm text-frosted-blue
                      placeholder:text-steel-blue/60 focus:outline-none focus:ring-2 focus:ring-steel-blue w-48 sm:w-64"/>
      </div>
    </div>

    <!-- States -->
    <div id="loadingState" class="py-16 text-center text-steel-blue">
      <span class="material-symbols-outlined animate-spin text-3xl">progress_activity</span>
      <p class="mt-2 text-sm">Loading your library…</p>
    </div>

    <div id="unavailableState" class="hidden py-16 text-center">
      <span class="material-symbols-outlined text-4xl text-steel-blue/60">cloud_off</span>
      <p class="mt-3 text-frosted-blue font-semibold">Library unavailable</p>
      <p id="unavailableDetail" class="mt-1 text-sm text-steel-blue max-w-md mx-auto">
        The book service isn't responding right now. Everything else on the site is unaffected.
      </p>
      <button id="retryBtn" class="mt-4 px-4 py-2 rounded-xl bg-baltic-blue/30 border border-steel-blue/30
                                   text-sm text-frosted-blue hover:bg-baltic-blue/50">Try again</button>
    </div>

    <div id="emptyState" class="hidden py-16 text-center">
      <span class="material-symbols-outlined text-4xl text-steel-blue/60">search_off</span>
      <p class="mt-3 text-frosted-blue font-semibold">No books found</p>
      <p id="emptyDetail" class="mt-1 text-sm text-steel-blue">Try a different search.</p>
    </div>

    <div id="bookGrid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-6 2xl:grid-cols-8 gap-4"></div>

    <!-- Pagination -->
    <div id="pager" class="hidden mt-8 flex items-center justify-center gap-2">
      <button id="prevBtn" class="px-3 py-2 rounded-xl bg-baltic-blue/20 border border-steel-blue/30 text-sm
                                  text-frosted-blue disabled:opacity-30 disabled:cursor-not-allowed hover:bg-baltic-blue/40">
        <span class="material-symbols-outlined text-[18px] align-middle">chevron_left</span>
      </button>
      <span id="pageLabel" class="text-sm text-steel-blue tabular-nums px-2"></span>
      <button id="nextBtn" class="px-3 py-2 rounded-xl bg-baltic-blue/20 border border-steel-blue/30 text-sm
                                  text-frosted-blue disabled:opacity-30 disabled:cursor-not-allowed hover:bg-baltic-blue/40">
        <span class="material-symbols-outlined text-[18px] align-middle">chevron_right</span>
      </button>
    </div>
  </section>

</div>
</main>

<script src="/static/js/auth.js"></script>
<script src="/static/js/header.js?v=2"></script>
<script src="/static/js/sidebar.js?v=14"></script>
<script src="/static/js/notifications.js?v=3"></script>
<script>
(function () {
  'use strict';

  var PAGE_SIZE = 24;
  var state = { page: 1, totalPages: 0, total: 0, query: '', hasNext: false };

  var el = function (id) { return document.getElementById(id); };

  /**
   * Call Kavita through WebServarr's proxy.
   *
   * A 401 means this session has no Kavita token yet (or it expired). The
   * handshake is a full-page OIDC redirect chain, so it cannot be done inside
   * fetch() - send the browser to /kavita/connect, which silently reauthenticates
   * and redirects back here.
   */
  function kavita(path, options) {
    options = options || {};
    options.credentials = 'include';
    return fetch('/kavita' + path, options).then(function (res) {
      if (res.status === 401) {
        window.location.href = '/kavita/connect';
        throw new Error('reconnecting');
      }
      return res;
    });
  }

  function filterBody(extra) {
    var body = { statements: [], combination: 0, limitTo: 0 };
    if (extra) { for (var k in extra) body[k] = extra[k]; }
    return JSON.stringify(body);
  }

  /** Shelves are browsing aids; they only make sense when not searching. */
  function setShelvesVisible(visible) {
    el('shelves').classList.toggle('hidden', !visible);
  }

  function show(which) {
    ['loadingState', 'unavailableState', 'emptyState', 'bookGrid'].forEach(function (id) {
      el(id).classList.toggle('hidden', id !== which);
    });
    if (which !== 'bookGrid') el('pager').classList.add('hidden');
  }

  function coverUrl(seriesId) {
    return '/kavita/api/image/series-cover?seriesId=' + encodeURIComponent(seriesId);
  }

  function bookCard(series) {
    var name = series.name || 'Untitled';
    // A book opens its detail sheet first, the way clicking a film does
    // elsewhere. Still an <a> to the reader so middle-click, ctrl-click and
    // "open in new tab" keep working, and so it is reachable by keyboard.
    var a = document.createElement('a');
    a.href = '/reader?seriesId=' + encodeURIComponent(series.id);
    a.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      openBookDetail(series);
    });
    a.className = 'book-card group block';
    a.innerHTML =
      '<div class="book-cover relative overflow-hidden rounded-xl bg-baltic-blue/20 border border-steel-blue/20">' +
        '<img class="book-cover-img w-full h-full object-cover" loading="lazy" alt="" src="' + coverUrl(series.id) + '"' +
             ' onerror="this.style.display=\'none\'"/>' +
      '</div>' +
      '<p class="mt-2 text-sm text-frosted-blue leading-snug line-clamp-2">' + escapeHtml(name) + '</p>';
    return a;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderGrid(items) {
    var grid = el('bookGrid');
    grid.innerHTML = '';
    if (!items.length) {
      el('emptyDetail').textContent = state.query
        ? 'Nothing matched "' + state.query + '".'
        : 'This library has no books yet.';
      show('emptyState');
      return;
    }
    items.forEach(function (s) { grid.appendChild(bookCard(s)); });
    show('bookGrid');
    updatePager();
  }

  function updatePager() {
    // Hide only when searching, or when there is genuinely a single page.
    if (state.query || (state.page === 1 && !state.hasNext)) {
      el('pager').classList.add('hidden');
      return;
    }
    el('pager').classList.remove('hidden');
    // Kavita does not always return an x-pagination header on Series/all-v2, so
    // the total can be unknown. Fall back to a page number without a total
    // rather than disabling navigation entirely.
    el('pageLabel').textContent = state.totalPages
      ? 'Page ' + state.page + ' of ' + state.totalPages
      : 'Page ' + state.page;
    el('prevBtn').disabled = state.page <= 1;
    el('nextBtn').disabled = state.totalPages
      ? state.page >= state.totalPages
      : !state.hasNext;
  }

  function loadPage() {
    show('loadingState');
    kavita('/api/Series/all-v2?pageNumber=' + state.page + '&pageSize=' + PAGE_SIZE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: filterBody()
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // Kavita reports paging totals here when it sends them at all.
      var pagination = res.headers.get('x-pagination');
      if (pagination) {
        try {
          var p = JSON.parse(pagination);
          state.total = p.totalItems || 0;
          state.totalPages = p.totalPages || 0;
        } catch (e) { /* header shape changed; fall back to count-based paging */ }
      }
      return res.json();
    }).then(function (items) {
      items = items || [];
      // With no totals header, a full page implies there is probably another.
      state.hasNext = items.length >= PAGE_SIZE;
      el('libraryCount').textContent = state.total ? state.total + ' books' : '';
      renderGrid(items);
    }).catch(function (err) {
      if (err && err.message === 'reconnecting') return;
      showUnavailable(err);
    });
  }

  function runSearch(query) {
    state.query = query;
    setShelvesVisible(!query);
    if (!query) { state.page = 1; loadPage(); return; }
    show('loadingState');
    kavita('/api/Search/search?queryString=' + encodeURIComponent(query))
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var items = (data && data.series) ? data.series : [];
        // Searching an author name matches a person, not a series, so resolve
        // matched people to the books they are known for. Without this,
        // "abnett" returns nothing even though he wrote a dozen of these.
        var people = (data && data.persons) ? data.persons.slice(0, 3) : [];
        if (!items.length && people.length) {
          return Promise.all(people.map(function (p) {
            return kavita('/api/Person/series-known-for?personId=' + encodeURIComponent(p.id))
              .then(function (r) { return r.ok ? r.json() : []; })
              .catch(function () { return []; });
          })).then(function (lists) {
            var seen = {}, merged = [];
            lists.forEach(function (list) {
              (list || []).forEach(function (s) {
                if (!seen[s.id]) { seen[s.id] = true; merged.push(s); }
              });
            });
            return merged;
          });
        }
        return items;
      })
      .then(function (items) {
        if (state.query !== query) return;   // a newer keystroke already won
        el('libraryCount').textContent = items.length + ' result' + (items.length === 1 ? '' : 's');
        renderGrid(items);
      })
      .catch(function (err) {
        if (err && err.message === 'reconnecting') return;
        showUnavailable(err);
      });
  }

  /**
   * Discovery shelves, in the spirit of the Plex home screen.
   *
   * Note these come from endpoints a normal user can reach. Kavita's
   * stats/popular-* endpoints return 403 for non-admins — they are server
   * statistics, not a discovery feed — so "popular" is not available here.
   * Sorting the catalog is, which is what Top Rated uses.
   */
  var SHELVES = [
    {
      id: 'continue', title: 'Continue Reading', icon: 'book_ribbon',
      load: function () {
        return kavita('/api/Series/on-deck?pageNumber=1&pageSize=8', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: filterBody()
        });
      }
    },
    {
      id: 'recent', title: 'Recently Added', icon: 'new_releases',
      load: function () {
        return kavita('/api/Series/all-v2?pageNumber=1&pageSize=8', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          // sortField 2 = Created
          body: filterBody({ sortOptions: { sortField: 2, isAscending: false } })
        });
      }
    },
    {
      id: 'toprated', title: 'Top Rated', icon: 'star',
      // Meaningful only once books have been rated; until then the ordering is
      // effectively arbitrary, so the shelf hides itself when nothing is rated.
      requiresRatings: true,
      load: function () {
        return kavita('/api/Series/all-v2?pageNumber=1&pageSize=8', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          // sortField 8 = AverageRating
          body: filterBody({ sortOptions: { sortField: 8, isAscending: false } })
        });
      }
    }
  ];

  function renderShelf(shelf, items) {
    if (!items || !items.length) return;
    if (shelf.requiresRatings) {
      var anyRated = items.some(function (s) {
        return (s.userRating || 0) > 0 || (s.avgRating || 0) > 0;
      });
      if (!anyRated) return;   // nothing rated yet; an arbitrary order helps nobody
    }

    var section = document.createElement('section');
    section.id = 'shelf-' + shelf.id;
    var head = document.createElement('div');
    head.className = 'flex items-center gap-3 mb-4';
    head.innerHTML =
      '<span class="material-symbols-outlined text-steel-blue">' + shelf.icon + '</span>' +
      '<h3 class="text-xl font-bold text-frosted-blue">' + escapeHtml(shelf.title) + '</h3>';
    var row = document.createElement('div');
    row.className = 'grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-8 gap-4';
    items.forEach(function (s) { row.appendChild(bookCard(s)); });
    section.appendChild(head);
    section.appendChild(row);
    el('shelves').appendChild(section);
  }

  function loadShelves() {
    el('shelves').innerHTML = '';
    // Sequential so the shelves always render in a stable order.
    return SHELVES.reduce(function (chain, shelf) {
      return chain.then(function () {
        return shelf.load()
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (items) { renderShelf(shelf, items); })
          .catch(function () { /* a shelf is a convenience; never block the library */ });
      });
    }, Promise.resolve());
  }

  function showUnavailable(err) {
    if (err) console.warn('Library load failed:', err);
    show('unavailableState');
  }

  // Apply the admin's configured icon, like other pages do.
  function applyBrandingIcons() {
    var theme = window.WEBSERVARR_THEME || {};
    var icons = theme.icons || {};
    if (icons.nav_library) el('iconLibrary').textContent = icons.nav_library;
  }

  var searchTimer = null;
  el('searchInput').addEventListener('input', function (e) {
    var value = e.target.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { runSearch(value); }, 300);
  });

  el('prevBtn').addEventListener('click', function () {
    if (state.page > 1) { state.page--; loadPage(); }
  });
  el('nextBtn').addEventListener('click', function () {
    // totalPages is 0 when Kavita sends no x-pagination header, so gate on
    // hasNext in that case rather than on a total we do not have.
    var canAdvance = state.totalPages ? state.page < state.totalPages : state.hasNext;
    if (canAdvance) { state.page++; loadPage(); }
  });
  el('retryBtn').addEventListener('click', function () { loadPage(); loadShelves(); });

  /* ---- Book detail sheet ----
   *
   * Assembled from three sources, each filled in as it arrives so the sheet
   * opens instantly rather than waiting on the slowest one:
   *   - the series row we already hold (title, cover)
   *   - Kavita metadata (summary, writer, genres, year)
   *   - Chaptarr/Goodreads (rating), which is a network hop and may be absent
   *
   * Reviews are deliberately absent: Kavita exposes no review endpoint on this
   * build (every candidate 404s, and external-series-detail is 403), and
   * Goodreads has no public API for them. Showing an empty "Reviews" heading
   * would be worse than not claiming to have them.
   */
  var _bdSeries = null;

  function bdEl(id) { return document.getElementById(id); }

  function stripHtml(html) {
    if (!html) return '';
    var d = document.createElement('div');
    d.innerHTML = html;
    return (d.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  function fact(label, value) {
    if (value === null || value === undefined || value === '') return '';
    return '<span><span class="text-steel-blue/60">' + label + '</span> ' +
           '<span class="text-frosted-blue">' + escapeHtml(String(value)) + '</span></span>';
  }

  function openBookDetail(series) {
    _bdSeries = series;
    var modal = bdEl('bookDetail');

    bdEl('bdTitle').textContent = series.name || 'Untitled';
    bdEl('bdAuthor').textContent = '';
    bdEl('bdSummary').textContent = 'Loading…';
    bdEl('bdFacts').innerHTML = '';
    bdEl('bdGenres').innerHTML = '';
    bdEl('bdCover').style.visibility = '';
    bdEl('bdCover').src = coverUrl(series.id);
    bdEl('bdProgressWrap').classList.add('hidden');

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    bdEl('bdRead').focus();

    loadBookDetail(series);
  }

  function closeBookDetail() {
    var modal = bdEl('bookDetail');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function loadBookDetail(series) {
    var facts = [];

    // Kavita metadata and the series row in parallel; neither blocks the other.
    Promise.all([
      kavita('/api/Series/metadata?seriesId=' + series.id).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      kavita('/api/Series/' + series.id).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]).then(function (res) {
      if (_bdSeries !== series) return;      // a different book was opened meanwhile
      var md = res[0] || {};
      var dt = res[1] || {};

      var author = (md.writers && md.writers.length) ? md.writers[0].name : '';
      bdEl('bdAuthor').textContent = author;

      var summary = stripHtml(md.summary);
      bdEl('bdSummary').textContent = summary || 'No description available for this book.';

      if (md.releaseYear) facts.push(fact('Published', md.releaseYear));
      if (dt.pages) facts.push(fact('Pages', dt.pages.toLocaleString()));
      if (dt.wordCount) facts.push(fact('Words', Math.round(dt.wordCount / 1000) + 'k'));
      if (dt.avgHoursToRead) {
        var h = dt.avgHoursToRead;
        facts.push(fact('Reading time', h < 1 ? '< 1 hr' : Math.round(h) + ' hr'));
      }
      bdEl('bdFacts').innerHTML = facts.join('');

      var chips = (md.genres || []).concat(md.tags || []).slice(0, 8);
      bdEl('bdGenres').innerHTML = chips.map(function (g) {
        return '<span class="text-[10px] px-2 py-0.5 rounded-full bg-baltic-blue/30 border border-steel-blue/25 text-steel-blue">' +
               escapeHtml(g.title || '') + '</span>';
      }).join('');

      // Your own progress through this book.
      if (dt.pages && dt.pagesRead) {
        var pct = Math.min(100, Math.round(100 * dt.pagesRead / dt.pages));
        bdEl('bdProgressWrap').classList.remove('hidden');
        bdEl('bdProgressBar').style.width = pct + '%';
        bdEl('bdProgressText').textContent = pct + '% read';
        bdEl('bdRead').textContent = 'Continue reading';
      } else {
        bdEl('bdRead').textContent = 'Read';
      }

      // Rating last: it is an outbound lookup and the least important line.
      var url = '/api/integrations/book-rating?title=' + encodeURIComponent(series.name || '') +
                '&author=' + encodeURIComponent(author || '');
      fetch(url, { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (rt) {
          if (_bdSeries !== series || !rt || !rt.rating) return;
          var stars = '★ ' + rt.rating.toFixed(2);
          var votes = rt.votes ? ' (' + Number(rt.votes).toLocaleString() + ' ratings)' : '';
          facts.unshift('<span class="text-frosted-blue font-semibold">' + stars + '</span>' +
                        '<span class="text-steel-blue/60">' + votes + ' · ' + escapeHtml(rt.source || '') + '</span>');
          bdEl('bdFacts').innerHTML = facts.join('');
        })
        .catch(function () { /* no rating is fine */ });
    });
  }

  /* The sheet's markup sits at the end of <body>, after this script, so it does
     not exist yet when this runs. Wiring it immediately threw a null reference
     that killed the rest of this module - including the Kavita reconnect - and
     left the library stuck on "Loading". Wait for the document instead. */
  function wireBookDetail() {
    if (!bdEl('bookDetail')) return;
    bdEl('bdClose').addEventListener('click', closeBookDetail);
    bdEl('bookDetail').addEventListener('click', function (e) {
      if (e.target === this) closeBookDetail();
    });
    bdEl('bdRead').addEventListener('click', function () {
      if (_bdSeries) location.href = '/reader?seriesId=' + encodeURIComponent(_bdSeries.id);
    });
    document.addEventListener('keydown', function (e) {
      var m = bdEl('bookDetail');
      if (e.key === 'Escape' && m && !m.classList.contains('hidden')) closeBookDetail();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireBookDetail);
  } else {
    wireBookDetail();
  }


  document.addEventListener('DOMContentLoaded', function () {
    // header.js self-initialises on load; calling it again renders a second header.
    if (typeof initSidebar === 'function') initSidebar('library');
    setTimeout(applyBrandingIcons, 300);

    // The sidebar nav renders at opacity-0 and is only faded in by
    // showAdminNav(), which every page calls after checkAuth(). Without this the
    // nav is present in the DOM but never painted.
    checkAuth().then(function (user) {
      var uEl = document.getElementById('headerUsername');
      var rEl = document.getElementById('headerRole');
      if (uEl) uEl.textContent = user.display_name || user.username;
      if (rEl) rEl.textContent = user.is_admin ? 'Admin' : 'Member';
      showAdminNav(user.is_admin);

      var menuBtn = document.getElementById('userMenuBtn');
      var menuDrop = document.getElementById('userMenuDropdown');
      if (menuBtn && menuDrop) {
        menuBtn.addEventListener('click', function () { menuDrop.classList.toggle('hidden'); });
        document.addEventListener('click', function (e) {
          if (!menuBtn.contains(e.target) && !menuDrop.contains(e.target)) menuDrop.classList.add('hidden');
        });
      }
    }).catch(function () {
      /* checkAuth redirects to /login itself when unauthenticated. */
    });

    loadShelves();
    loadPage();
  });
})();

/* ---- eBooks guide (coach marks) ----
 *
 * Spotlights each part of the page in turn: the fog dims everything, a hole is
 * cut around the element being described, and a bubble points at it.
 *
 * Starts by itself on a first visit rather than hiding behind a button - a
 * tour nobody opens teaches nobody anything. The help button re-runs it.
 *
 * DEVELOPMENT: set localStorage.webservarr_tour_always = '1' (or append
 * ?tour=1) and the tour runs on every visit and never records itself as seen.
 */
(function () {
  'use strict';

  var SEEN_KEY = 'webservarr_ebooks_guide_seen';

  function devAlways() {
    try {
      if (localStorage.getItem('webservarr_tour_always') === '1') return true;
    } catch (e) {}
    return /[?&]tour=1\b/.test(location.search);
  }

  /* Each step names a target by selector. `fallback` is used when the primary
     element is absent - shelves only exist once something has been read, and a
     tour must not break on an empty library. */
  var STEPS = [
    {
      /* The first shelf row, not the whole shelves block: a spotlight the size
         of the viewport highlights nothing. */
      target: '#shelves > *:first-child',
      fallback: '#bookGrid',
      icon: 'auto_stories',
      title: 'Welcome to eBooks',
      body: 'Everything here reads in your browser — nothing to install, and no separate account. Your place in a book saves itself, and it is private to you.'
    },
    {
      target: '#shelves > *:first-child',
      fallback: '#bookGrid',
      icon: 'bookmark',
      title: 'Your shelves',
      body: 'Continue Reading appears once you start a book and follows you between devices. Recently Added is whatever arrived most recently.'
    },
    {
      target: '#searchInput',
      icon: 'search',
      title: 'Finding a book',
      body: 'Search the whole library by title or author. Below it is every book we hold, in a grid you can page through.'
    },
    {
      /* A single cover, so "click a cover" points at an actual cover. */
      target: '#bookGrid > *:first-child',
      fallback: '#shelves img',
      icon: 'menu_book',
      title: 'Open anything',
      body: 'Click a cover to read it. In the reader, turn pages from the left and right edges or with the arrow keys, jump chapters from Contents, and click the page number to skip straight to a page.'
    },
    {
      target: 'a[href="/requests"]',
      icon: 'add_circle',
      title: 'Missing something?',
      body: 'Search for it under Requests — books sit alongside films and TV. Press Request eBook and it arrives here on its own.'
    }
  ];

  var step = 0;
  var active = false;

  function q(id) { return document.getElementById(id); }

  function targetFor(s) {
    var el = document.querySelector(s.target);
    if (el && el.offsetParent !== null) return el;
    return s.fallback ? document.querySelector(s.fallback) : null;
  }

  function place() {
    var s = STEPS[step];
    var el = targetFor(s);
    var spot = q('tourSpotlight');
    var bubble = q('tourBubble');
    var arrow = q('tourArrow');

    var pad = 8;
    var r = el
      ? el.getBoundingClientRect()
      /* Nothing to point at: centre the bubble with a collapsed spotlight so
         the step still reads rather than pointing at the top-left corner. */
      : { top: window.innerHeight / 2, left: window.innerWidth / 2, width: 0, height: 0, bottom: window.innerHeight / 2, right: window.innerWidth / 2 };

    spot.style.top = (r.top - pad) + 'px';
    spot.style.left = (r.left - pad) + 'px';
    spot.style.width = (r.width + pad * 2) + 'px';
    spot.style.height = (r.height + pad * 2) + 'px';
    spot.style.opacity = el ? '1' : '0';

    var bw = bubble.offsetWidth || 336;
    var bh = bubble.offsetHeight || 160;
    var gap = 16;
    var margin = 12;
    var side, top, left;

    if (r.bottom + gap + bh < window.innerHeight - margin) {
      side = 'bottom';                       // bubble sits below, arrow on top
      top = r.bottom + gap;
      left = r.left + r.width / 2 - bw / 2;
    } else if (r.top - gap - bh > margin) {
      side = 'top';
      top = r.top - gap - bh;
      left = r.left + r.width / 2 - bw / 2;
    } else if (r.right + gap + bw < window.innerWidth - margin) {
      side = 'right';
      top = r.top + r.height / 2 - bh / 2;
      left = r.right + gap;
    } else {
      side = 'left';
      top = r.top + r.height / 2 - bh / 2;
      left = Math.max(margin, r.left - gap - bw);
    }

    left = Math.max(margin, Math.min(left, window.innerWidth - bw - margin));
    top = Math.max(margin, Math.min(top, window.innerHeight - bh - margin));
    bubble.style.top = top + 'px';
    bubble.style.left = left + 'px';

    arrow.setAttribute('data-side', side);
    arrow.style.left = arrow.style.top = '';
    if (side === 'top' || side === 'bottom') {
      var ax = r.left + r.width / 2 - left - 7;
      arrow.style.left = Math.max(14, Math.min(ax, bw - 28)) + 'px';
    } else {
      var ay = r.top + r.height / 2 - top - 7;
      arrow.style.top = Math.max(14, Math.min(ay, bh - 28)) + 'px';
    }
  }

  function render() {
    var s = STEPS[step];
    q('tourIcon').textContent = s.icon;
    q('tourTitle').textContent = s.title;
    q('tourBody').textContent = s.body;

    var dots = q('tourDots');
    dots.innerHTML = '';
    STEPS.forEach(function (_, i) {
      var d = document.createElement('span');
      d.className = 'size-1.5 rounded-full ' + (i === step ? 'bg-frosted-blue' : 'bg-frosted-blue/30');
      dots.appendChild(d);
    });

    q('tourBack').style.visibility = step === 0 ? 'hidden' : 'visible';
    q('tourNext').textContent = step === STEPS.length - 1 ? 'Got it' : 'Continue';

    var el = targetFor(s);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    // Let the scroll settle before measuring, or the bubble lands where the
    // target used to be.
    setTimeout(place, 380);
  }

  function start() {
    if (active) return;
    active = true;
    step = 0;
    q('tourLayer').classList.remove('hidden');
    render();
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
  }

  function finish() {
    active = false;
    q('tourLayer').classList.add('hidden');
    window.removeEventListener('resize', place);
    window.removeEventListener('scroll', place, true);
    if (!devAlways()) {
      try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
    }
  }

  function wire() {
    q('tourNext').addEventListener('click', function () {
      if (step < STEPS.length - 1) { step++; render(); } else { finish(); }
    });
    q('tourBack').addEventListener('click', function () {
      if (step > 0) { step--; render(); }
    });
    q('tourSkip').addEventListener('click', finish);
    document.addEventListener('keydown', function (e) {
      if (!active) return;
      if (e.key === 'Escape') finish();
      else if (e.key === 'ArrowRight') q('tourNext').click();
      else if (e.key === 'ArrowLeft') q('tourBack').click();
    });

    var help = q('helpBtn');
    if (help) help.addEventListener('click', start);

    var seen = false;
    try { seen = localStorage.getItem(SEEN_KEY) === '1'; } catch (e) {}
    if (!seen || devAlways()) {
      // Wait for the shelves and grid to render, so the spotlight has real
      // geometry to sit on rather than empty placeholders.
      setTimeout(start, 1200);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wire);
  } else {
    wire();
  }
})();

</script>


<!-- Guided tour: fog-of-war spotlight plus a bubble anchored to the element
     being described. Both are built at runtime and positioned from the target's
     real geometry, so they follow the page rather than guessing at it. -->
<div id="tourLayer" class="hidden">
  <div id="tourSpotlight" class="tour-spotlight"></div>
  <div id="tourBubble" class="tour-bubble">
    <div id="tourArrow" class="tour-arrow" data-side="top"></div>
    <div class="p-4">
      <div class="flex items-start gap-2">
        <span id="tourIcon" class="material-symbols-outlined text-[20px] text-frosted-blue shrink-0">auto_stories</span>
        <h3 id="tourTitle" class="flex-1 font-bold text-frosted-blue text-sm leading-snug"></h3>
        <button id="tourSkip" class="text-[11px] text-frosted-blue/60 hover:text-frosted-blue shrink-0">Skip</button>
      </div>
      <p id="tourBody" class="mt-2 text-[13px] text-frosted-blue/85 leading-relaxed"></p>
      <div class="mt-3 flex items-center gap-3">
        <div id="tourDots" class="flex items-center gap-1.5"></div>
        <div class="ml-auto flex items-center gap-2">
          <button id="tourBack" class="px-2.5 py-1 rounded-lg text-[12px] text-frosted-blue/80 hover:text-frosted-blue hover:bg-frosted-blue/10">Back</button>
          <button id="tourNext" class="px-3 py-1.5 rounded-lg bg-frosted-blue text-background-dark text-[12px] font-bold hover:bg-frosted-blue/90">Continue</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Book detail sheet. Opens on clicking a cover, the way a film does on Plex:
     what the book is and whether you want it, before committing to reading it. -->
<div id="bookDetail" class="hidden fixed inset-0 z-[65] items-center justify-center p-4 bg-black/75" role="dialog" aria-modal="true" aria-labelledby="bdTitle">
  <div class="glass-card rounded-2xl w-full max-w-3xl max-h-[88vh] overflow-y-auto custom-scrollbar">
    <div class="flex flex-col sm:flex-row gap-5 p-5 sm:p-6">

      <div class="shrink-0 mx-auto sm:mx-0 w-40">
        <img id="bdCover" alt="" class="w-40 rounded-xl border border-steel-blue/20 bg-baltic-blue/20"
             onerror="this.style.visibility='hidden'"/>
        <button id="bdRead"
                class="mt-3 w-full py-2.5 rounded-xl bg-primary hover:bg-primary/80 text-bright text-sm font-bold transition-colors">
          Read
        </button>
        <div id="bdProgressWrap" class="hidden mt-3">
          <div class="h-1.5 rounded-full bg-steel-blue/20 overflow-hidden">
            <div id="bdProgressBar" class="h-full rounded-full bg-frosted-blue" style="width:0%"></div>
          </div>
          <p id="bdProgressText" class="mt-1 text-[10px] text-steel-blue"></p>
        </div>
      </div>

      <div class="min-w-0 flex-1">
        <div class="flex items-start gap-3">
          <div class="min-w-0 flex-1">
            <h2 id="bdTitle" class="text-xl font-bold text-frosted-blue leading-tight"></h2>
            <p id="bdAuthor" class="mt-0.5 text-sm text-steel-blue"></p>
          </div>
          <button id="bdClose" aria-label="Close"
                  class="p-1 rounded-lg text-steel-blue hover:text-frosted-blue hover:bg-baltic-blue/30 shrink-0">
            <span class="material-symbols-outlined text-[20px]">close</span>
          </button>
        </div>

        <!-- Facts row: only the ones that exist for this book are rendered. -->
        <div id="bdFacts" class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-[11px] text-steel-blue"></div>

        <div id="bdGenres" class="mt-3 flex flex-wrap gap-1.5"></div>

        <p id="bdSummary" class="mt-4 text-sm text-frosted-blue/85 leading-relaxed whitespace-pre-line"></p>
      </div>
    </div>
  </div>
</div>
</body></html>
