<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Series</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->

<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- ws:header -->
<!-- A series in reading order, swapped by the router. Both list pages run pages/books-list.js; data-kind says which. -->
<div id="wsPage" data-ws-module="/static/js/pages/books-list.js?v=1" data-kind="series" class="flex-1 flex flex-col min-h-0 lg:overflow-hidden">
<div class="flex-1 lg:overflow-y-auto p-4 lg:p-8 custom-scrollbar">
<div class="max-w-[1200px] w-full mx-auto min-w-0">

  <a id="backLink" href="/books" class="-ml-2 inline-flex items-center h-10 pl-1 pr-3 rounded-[10px] text-[15px] font-semibold text-frosted-blue/70 hover:text-frosted-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-frosted-blue">
    <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>Books
  </a>

  <!-- The heading's text and everything under it arrive in one write
       (pages/books-list.js commit). The skeleton is the list's own shape, so
       nothing already on screen moves. The h1 stays; what follows it is replaced. -->
  <section id="listView" data-arrive="list" aria-busy="true" class="mt-4">
    <h1 id="listTitle" class="text-[24px] sm:text-[32px] font-extrabold leading-[1.1] tracking-[-0.02em] text-balance break-words text-frosted-blue"><span class="skel-text">The series name</span></h1>
    <div id="listRest" aria-hidden="true">
      <p class="mt-2 text-[15px] leading-6 text-frosted-blue/70"><span class="skel-text">7 books, in reading order</span></p>
      <div class="mt-6 max-w-3xl space-y-3">
        <div class="grid grid-cols-[1.5rem_3.75rem_minmax(0,1fr)] items-center gap-3 rounded-2xl bg-frosted-blue/[0.04] p-2.5 sm:grid-cols-[2rem_4.5rem_minmax(0,1fr)] sm:gap-4 sm:p-3">
          <div class="skel mx-auto h-6 w-6"></div>
          <div class="skel aspect-[2/3] rounded-xl"></div>
          <div class="space-y-2"><div class="skel h-5 w-3/4"></div><div class="skel h-4 w-1/2"></div><div class="skel h-4 w-2/3"></div></div>
        </div>
        <div class="grid grid-cols-[1.5rem_3.75rem_minmax(0,1fr)] items-center gap-3 rounded-2xl bg-frosted-blue/[0.04] p-2.5 sm:grid-cols-[2rem_4.5rem_minmax(0,1fr)] sm:gap-4 sm:p-3">
          <div class="skel mx-auto h-6 w-6"></div>
          <div class="skel aspect-[2/3] rounded-xl"></div>
          <div class="space-y-2"><div class="skel h-5 w-3/4"></div><div class="skel h-4 w-1/2"></div><div class="skel h-4 w-2/3"></div></div>
        </div>
        <div class="grid grid-cols-[1.5rem_3.75rem_minmax(0,1fr)] items-center gap-3 rounded-2xl bg-frosted-blue/[0.04] p-2.5 sm:grid-cols-[2rem_4.5rem_minmax(0,1fr)] sm:gap-4 sm:p-3">
          <div class="skel mx-auto h-6 w-6"></div>
          <div class="skel aspect-[2/3] rounded-xl"></div>
          <div class="space-y-2"><div class="skel h-5 w-3/4"></div><div class="skel h-4 w-1/2"></div><div class="skel h-4 w-2/3"></div></div>
        </div>
        <div class="grid grid-cols-[1.5rem_3.75rem_minmax(0,1fr)] items-center gap-3 rounded-2xl bg-frosted-blue/[0.04] p-2.5 sm:grid-cols-[2rem_4.5rem_minmax(0,1fr)] sm:gap-4 sm:p-3">
          <div class="skel mx-auto h-6 w-6"></div>
          <div class="skel aspect-[2/3] rounded-xl"></div>
          <div class="space-y-2"><div class="skel h-5 w-3/4"></div><div class="skel h-4 w-1/2"></div><div class="skel h-4 w-2/3"></div></div>
        </div>
        <div class="grid grid-cols-[1.5rem_3.75rem_minmax(0,1fr)] items-center gap-3 rounded-2xl bg-frosted-blue/[0.04] p-2.5 sm:grid-cols-[2rem_4.5rem_minmax(0,1fr)] sm:gap-4 sm:p-3">
          <div class="skel mx-auto h-6 w-6"></div>
          <div class="skel aspect-[2/3] rounded-xl"></div>
          <div class="space-y-2"><div class="skel h-5 w-3/4"></div><div class="skel h-4 w-1/2"></div><div class="skel h-4 w-2/3"></div></div>
        </div>
      </div>
    </div>
  </section>

</div>
</div>
</div>
</main>

<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
<script src="/static/js/kavita-connect.js?v=1" data-ws-page-script></script>
</body></html>
