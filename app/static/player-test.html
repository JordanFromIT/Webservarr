<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WebServarr - Audiobook test</title>
<link rel="icon" href="/static/webservarr.svg"/>
<script src="/static/js/theme-loader.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<link href="/static/css/app.css?v=1" rel="stylesheet"/>
<link href="/static/css/theme.css?v=12" rel="stylesheet"/>
</head>
<body class="bg-background-dark text-frosted-blue min-h-screen flex flex-col lg:flex-row lg:overflow-hidden">
<!-- ws:sidebar -->

<main class="flex-1 flex flex-col min-h-0 lg:h-screen lg:overflow-hidden">
<!-- ws:header -->

<div id="wsPage" data-ws-module="/static/js/pages/player-test.js?v=1" class="flex-1 flex flex-col min-h-0 lg:overflow-y-auto">
<!-- The audiobook player's test launcher: admins only, and only while the
     player is on (app/main.py); not linked from the navigation. Every book in
     the audiobook library with a Play button (js/pages/player-test.js). -->
<div class="p-4 lg:p-8 max-w-4xl w-full mx-auto">

  <div class="mb-6">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-steel-blue text-3xl" aria-hidden="true">headphones</span>
      <div class="min-w-0 flex-1">
        <h1 class="text-2xl lg:text-3xl font-bold text-frosted-blue leading-tight">Audiobook test</h1>
        <p class="text-sm text-steel-blue mt-0.5">Every book in the audiobook library. Admins only; not in the menu.</p>
      </div>
    </div>
  </div>

  <!-- The list. Each skeleton row is bookRow's row with nothing in it: the
       same cover box, two text lines and button, so a row lands on its
       skeleton without anything moving. Change one, change both. -->
  <ul id="ptBooks" class="grid gap-2" data-arrive="books" aria-label="Audiobooks">
    <li class="skel rounded-xl p-3 flex items-center gap-3 min-w-0" aria-hidden="true"><span class="size-14 sm:size-16 shrink-0"></span><span class="flex-1 min-w-0 invisible"><span class="block font-semibold">&nbsp;</span><span class="block text-xs mt-0.5">&nbsp;</span><span class="block text-xs mt-0.5">&nbsp;</span></span><span class="shrink-0 inline-flex items-center gap-1 px-3 py-2 text-sm font-semibold invisible"><span class="material-symbols-outlined text-base">play_arrow</span>Play</span></li>
    <li class="skel rounded-xl p-3 flex items-center gap-3 min-w-0" aria-hidden="true"><span class="size-14 sm:size-16 shrink-0"></span><span class="flex-1 min-w-0 invisible"><span class="block font-semibold">&nbsp;</span><span class="block text-xs mt-0.5">&nbsp;</span><span class="block text-xs mt-0.5">&nbsp;</span></span><span class="shrink-0 inline-flex items-center gap-1 px-3 py-2 text-sm font-semibold invisible"><span class="material-symbols-outlined text-base">play_arrow</span>Play</span></li>
    <li class="skel rounded-xl p-3 flex items-center gap-3 min-w-0" aria-hidden="true"><span class="size-14 sm:size-16 shrink-0"></span><span class="flex-1 min-w-0 invisible"><span class="block font-semibold">&nbsp;</span><span class="block text-xs mt-0.5">&nbsp;</span><span class="block text-xs mt-0.5">&nbsp;</span></span><span class="shrink-0 inline-flex items-center gap-1 px-3 py-2 text-sm font-semibold invisible"><span class="material-symbols-outlined text-base">play_arrow</span>Play</span></li>
  </ul>

</div>
</div>

</main>

<!-- Scripts -->
<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/notifications.js?v=3"></script>
</body>
</html>
