[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:redis]
; Sessions survive restarts: an append-only file under the persisted data
; volume (docker-entrypoint.sh creates the folder). No RDB snapshots. The
; AOF is rewritten from 4 MB (not Redis's 64 MB), so the records of ended
; sessions, tokens included, do not linger in it for weeks.
command=redis-server --bind 127.0.0.1 --port 6379 --dir /app/data/redis --appendonly yes --appendfsync everysec --auto-aof-rewrite-min-size 4mb --save ""
user=appuser
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
command=uvicorn app.main:app --host 0.0.0.0 --port 7979 --workers 2
directory=/app
user=appuser
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
